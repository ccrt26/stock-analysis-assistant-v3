[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-analysis-assistant"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.0",
  "httpx[socks]>=0.27",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0"]
data = ["tushare>=1.4.19"]
selection-lab = ["scikit-learn>=1.5,<2"]

[project.scripts]
stock-analyzer = "stock_analyzer.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
