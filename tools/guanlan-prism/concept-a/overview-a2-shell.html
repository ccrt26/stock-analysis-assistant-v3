<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="description" content="观澜 A2 主用展示：量价活跃度、40日主图、50日指数K线弹窗。只呈现本地冻结快照与本地补充日线，主用收盘研究页面。">
<title>观澜 · A2 — 收盘研究工作台</title>
<style>
/* A 黑白仪表台 · 视觉令牌。黑白为基底，红/青仅表示涨跌方向，琥珀仅标注观察目标。 */
:root{color-scheme:dark;
 --bg:#08090a;--panel:#101113;--raised:#161719;--text:#f1f0ee;--secondary:#b4b6bb;--muted:#858990;
 --line:#ffffff14;--accent:#ebece8;--accent-rgb:235,236,232;--up:#f08b8e;--down:#79c9b2;--down-rgb:121,201,178;--amber:#d6ba8d;
 --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
 --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
 --radius:4px;--previewh:0px}
*{box-sizing:border-box}html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit}button{cursor:pointer;color:inherit;border:0;background:none}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
h1,h2,h3,p{margin:0}svg{display:block;overflow:visible}svg text{font-family:var(--sans)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:400;letter-spacing:-.065em}
.muted{color:var(--muted)}.up{color:var(--up)}.down{color:var(--down)}
.eyebrow{font:10px/1.5 var(--mono);letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
.rule{height:1px;background:var(--line)}
.row{display:flex;align-items:center;gap:10px}.between{display:flex;align-items:center;justify-content:space-between;gap:16px}
.tag{padding:3px 9px;border:1px solid var(--line);font-size:11px;border-radius:3px;white-space:nowrap;color:var(--secondary)}
.tag.accent{color:var(--accent);border-color:rgba(var(--accent-rgb),.3);background:rgba(var(--accent-rgb),.055)}
.tag.up{color:var(--up)}.tag.down{color:var(--down)}
.dot{width:5px;height:5px;border-radius:50%;background:var(--accent);display:inline-block;box-shadow:0 0 12px rgba(var(--accent-rgb),.4)}
.text-button{font-size:12px;display:inline-flex;align-items:center;gap:7px;color:var(--secondary)}
.text-button:hover{color:var(--accent)}
.icon-button{width:34px;height:34px;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;border-radius:4px;color:var(--secondary);flex:none}
.icon-button:hover{background:var(--raised);border-color:rgba(var(--accent-rgb),.3)}
.icon-button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
select{background:var(--panel);color:var(--text);border:1px solid var(--line);padding:6px 9px;max-width:100%;border-radius:4px;font-size:11px}
/* 顶部预览说明条：与页面本体分离，标明这是评审稿。 */
.preview-bar{display:none}
.pv-label{display:flex;align-items:center;gap:12px;white-space:nowrap}
.pv-chip{width:26px;height:26px;border:1px solid #ffffff2e;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font:600 13px var(--mono)}
.pv-label strong{font-size:12px;letter-spacing:.04em;font-weight:500;display:block}
.pv-label small{font-size:10px;color:#9a9ca4;display:block;margin-top:1px}
.pv-links{display:flex;align-items:center;gap:14px;font-size:11px;color:#9a9ca4;white-space:nowrap;flex-wrap:wrap;justify-content:flex-end}
.pv-links a{color:#d8d8dc;border-bottom:1px solid #ffffff2b;padding-bottom:1px}
.pv-links a:hover{color:#fff}
/* 页面本体：左侧栏（品牌+导航）+ 内容列，参照正式 WEB 的骨架。 */
.app{position:relative;isolation:isolate;display:flex;align-items:stretch;min-height:calc(100vh - var(--previewh))}
.app:before{content:"";position:absolute;inset:0;z-index:-2;background:linear-gradient(90deg,transparent calc(100% - 1px),var(--line) 1px);background-size:25% 100%;opacity:.24;pointer-events:none}
.app:after{content:"";position:absolute;z-index:-1;inset:0;pointer-events:none;background:radial-gradient(ellipse at 78% 0%,rgba(var(--accent-rgb),.025),transparent 52%)}
.side{width:216px;flex:none;position:sticky;top:var(--previewh);align-self:flex-start;height:calc(100vh - var(--previewh));overflow-y:auto;border-right:1px solid var(--line);padding:30px 16px 22px;display:flex;flex-direction:column;gap:38px;scrollbar-width:none}
.side::-webkit-scrollbar{display:none}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px}
.brand-mark{width:28px;height:32px;color:var(--accent)}
.brand-mark svg{width:100%;height:100%}
.brand strong{font-size:19px;font-weight:600;letter-spacing:.18em;display:block}
.brand small{display:block;font:8px var(--mono);letter-spacing:.18em;color:var(--muted);margin-top:1px}
.side-nav{display:flex;flex-direction:column;gap:4px}
.side-nav .nav-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:6px;font-size:12px;color:var(--muted);text-align:left;white-space:nowrap}
.side-nav .nav-item:hover{color:var(--secondary);background:var(--raised)}
.side-nav .nav-item.active{color:var(--accent);background:rgba(var(--accent-rgb),.09)}
.side-nav sup{font:8px var(--mono);color:var(--muted);letter-spacing:.08em}
.side-bottom{margin-top:auto;display:flex;flex-direction:column;align-items:flex-start;gap:9px;padding:0 8px}
.side-bottom small{font-size:9px;color:var(--muted);line-height:1.7}
.date-chip{font:11px var(--mono);color:var(--secondary);border:1px solid var(--line);padding:6px 11px;border-radius:3px;white-space:nowrap}
.main{flex:1;min-width:0;max-width:1760px;margin:0 auto;padding:28px 34px 32px}
.page-title{margin-bottom:24px}
.page-title h1{font-size:31px;letter-spacing:-.04em;font-weight:500;line-height:1.4;margin-top:5px}
.page-title p{font-size:12px;color:var(--muted);margin-top:6px}
.report-meta{text-align:right;font-size:11px;color:var(--secondary);white-space:nowrap}
.report-meta small{display:block;color:var(--muted);margin-top:5px;font-size:10px}
/* 市场条 */
.market-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);margin-bottom:23px;border-radius:var(--radius);background:var(--panel)}
.market-item{padding:15px 21px;position:relative;min-height:101px;overflow:hidden}
.market-item+.market-item{border-left:1px solid var(--line)}
.market-label{font-size:12px;display:flex;gap:7px;align-items:baseline}
.market-label small{font:9px var(--mono);color:var(--muted)}
.market-nums{display:flex;align-items:baseline;gap:11px;margin-top:9px}
.market-nums strong{font-size:25px;letter-spacing:-.055em;font-weight:400}
.market-nums span{font:11px var(--mono)}
.market-spark{width:82px;height:35px;position:absolute;right:17px;bottom:16px;opacity:.55;color:var(--accent)}
.market-note{font-size:9px;color:var(--muted);margin-top:3px}
/* 区块标题与面板 */
.section-head{display:flex;justify-content:space-between;align-items:center;margin:22px 0 13px;gap:14px}
.section-head h2{font-size:15px;font-weight:500;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.section-head h2 .ht{white-space:nowrap}
.section-head h2 .eyebrow{font-size:9px}
.section-head .muted{font-size:12px;font-weight:400}
.focus-heading{margin-top:0}
.focus-controls{display:flex;align-items:center;gap:12px}
.focus-controls .num{font-size:12px;letter-spacing:0;color:var(--secondary)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);position:relative;overflow:hidden}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:19px 22px}
.panel-head h2,.panel-head h3{font-size:13px;font-weight:500}
.panel-head small{color:var(--muted);font-size:10px}
.panel-head .index{font:10px var(--mono);color:var(--muted)}
/* 事实仪表行 */
.instruments{display:grid;grid-template-columns:.93fr 1.15fr 1fr;gap:16px}
.instrument{min-height:243px}
.instrument .panel-head{padding-bottom:0}
.instrument-label{font-size:10px;color:var(--muted);padding:5px 22px 0}
.instrument-body{padding:5px 20px 12px}
.dial-wrap{display:flex;align-items:center;justify-content:center;gap:12px}
.dial{width:183px;height:177px;flex:none}
.dial text.metric{font:46px var(--mono);fill:var(--text);letter-spacing:-3px}
.dial text.caption{font:10px var(--sans);fill:var(--secondary)}
.dial-side{font-size:11px;color:var(--secondary);max-width:96px;line-height:1.7}
.dial-side b{display:block;font-weight:400;font:19px var(--mono);color:var(--text);margin:5px 0}
.dial-side .rule{margin:12px 0}
.stem-chart{height:166px;width:100%;padding:7px 0 0}
.stem-chart svg{width:100%;height:100%}
.range-dial{max-width:300px;width:100%;height:167px;margin:auto}
.instrument-footer{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);padding:0 22px 14px;gap:10px}
/* 主图 */
.hero-chart{margin-top:16px}
.chart-top{padding:21px 25px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.chart-top h2{font-size:19px;letter-spacing:.025em;font-weight:500;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.chart-top h2 .num{font-size:22px}
.chart-top p{font-size:11px;color:var(--muted);margin-top:5px}
.chart-switch{display:flex;border:1px solid var(--line);padding:3px;border-radius:4px;align-self:center;flex-shrink:0;white-space:nowrap}
.chart-switch button{padding:5px 10px;font-size:11px;color:var(--muted);border-radius:2px}
.chart-switch button.active{background:var(--raised);color:var(--text)}
.chart-area{position:relative;padding:12px 20px 0;min-width:0}
.price-chart{width:100%;display:block}
.chart-note{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin:14px 25px 0;border-top:1px solid var(--line);padding:13px 0 0}
.chart-note .note-main{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;min-width:0}
.chart-note p{font-size:12px;color:var(--secondary);line-height:1.9;flex:1;min-width:200px}
.episode-select{display:flex;align-items:center;gap:9px;font-size:11px;color:var(--muted);white-space:nowrap;flex:none}
.chart-foot{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 25px 17px;border-top:1px solid var(--line);font-size:10px;color:var(--muted);margin-top:14px}
.legend{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:15px;height:1px;background:var(--accent);display:inline-block}
.legend .dashed{background:repeating-linear-gradient(90deg,var(--secondary) 0 3px,transparent 3px 6px)}
.legend .amber{background:var(--amber)}
.legend .industry{background:var(--muted)}
.legend .benchmark{background:var(--secondary);opacity:.6}
/* 下半区：清单 + 更新 */
.body-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(310px,1fr);gap:20px;margin-top:24px}
.body-grid .section-head{margin-top:0}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 36px)/4);gap:12px;overflow-x:scroll;scrollbar-width:none;padding-bottom:4px;scroll-snap-type:x proximity}
.rail::-webkit-scrollbar{display:none}
.stock-card{min-width:0;padding:17px 16px;scroll-snap-align:start;transition:border-color .2s;text-align:left;display:block}
.stock-card:hover{border-color:rgba(var(--accent-rgb),.4)}
.stock-card h3{font-weight:500;font-size:14px}
.stock-card .code{font:9px var(--mono);color:var(--muted);margin-top:3px;display:block;letter-spacing:.025em}
.stock-card .price{font:26px var(--mono);margin-top:18px;letter-spacing:-.06em}
.stock-card .change{font:12px var(--mono);margin:3px 0 16px}
.stock-card .change small{font:9px var(--sans);color:var(--muted);margin-left:5px}
.stock-card .mini{height:37px;width:100%;margin-top:8px;color:var(--accent)}
.stock-card .card-bottom{border-top:1px solid var(--line);padding-top:11px;margin-top:12px;color:var(--muted);font-size:10px}
.stock-card .card-bottom span{display:block;margin-top:3px}
.rail-scroll-control{display:flex;align-items:center;gap:15px;margin-top:10px}
.rail-scroll-control input{flex:1;min-width:0;appearance:none;background:transparent;height:18px;margin:0;cursor:ew-resize}
.rail-scroll-control input::-webkit-slider-runnable-track{height:3px;background:var(--line);border-radius:4px}
.rail-scroll-control input::-webkit-slider-thumb{appearance:none;height:5px;width:56px;background:var(--accent);border-radius:4px;margin-top:-1px}
.rail-scroll-control input::-moz-range-track{height:3px;background:var(--line)}
.rail-scroll-control input::-moz-range-thumb{height:5px;width:56px;background:var(--accent);border:0}
.rail-scroll-control span{min-width:64px;text-align:right;font:10px var(--mono);color:var(--muted)}
.rail-caption{font-size:10px;color:var(--muted);margin-top:8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.updates{padding:0 20px}
.update{padding:17px 0;border-bottom:1px solid var(--line);text-align:left;display:block;width:100%}
.update:last-child{border:0}
.update h3{font-size:13px;font-weight:500}
.update time{font:9px var(--mono);color:var(--muted)}
.update p{font-size:12px;line-height:1.9;color:var(--secondary);margin-top:10px}
.transition{display:flex;align-items:center;gap:7px;margin-top:9px;font-size:11px;flex-wrap:wrap}
.transition .arrow{color:var(--muted)}
.transition small{font-size:9px;color:var(--muted)}
.updates-foot{border-top:1px solid var(--line);padding:12px 20px;font-size:10px;color:var(--muted)}
/* 观察星图页（点位配色保留涨红跌绿，版式与字体沿用黑白仪表台） */
.map-toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:0 0 14px;flex-wrap:wrap}
.segmented{display:flex;border:1px solid var(--line);padding:3px;border-radius:4px;gap:2px}
.segmented button{padding:6px 12px;font-size:11px;color:var(--muted);border-radius:2px}
.segmented button.active{background:var(--raised);color:var(--text)}
.map-stats{font:10px var(--mono);color:var(--muted);letter-spacing:.02em}
.map-layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:20px}
.map-layout>section,.map-layout>aside{min-width:0}
.map-layout>section{display:flex;flex-direction:column}
.map-wrap{flex:1 1 auto;min-height:520px;margin:0 10px;min-width:0}
.map-wrap svg{display:block}
.map-dot{cursor:pointer;outline:none}
.map-dot:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.graph-key{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:4px 22px 18px;font-size:10px;color:var(--muted)}
.graph-key i{width:7px;height:7px;border-radius:50%;background:var(--up);display:inline-block;margin-right:6px}
.graph-key i.down{background:var(--down)}
.map-pending{margin-top:12px;padding:0 22px 14px}
.map-pending-title{font-size:10px;color:var(--muted)}
.map-pending-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.map-pending-item{border:1px solid var(--line);border-radius:3px;padding:7px 11px;font-size:11px;color:var(--secondary);text-align:left}
.map-pending-item:hover{border-color:rgba(var(--accent-rgb),.4);color:var(--text)}
.map-pending-item b{font-weight:500;color:var(--text)}
.map-pending-item span{display:block;font:9px var(--mono);color:var(--muted);margin-top:2px}
/* 星图侧栏 */
/* 星图侧栏：与图表面板等高，正文纵向舒展，脚注固定到底部 */
.map-selection{display:flex;flex-direction:column}
.sel-body{padding:6px 20px 16px;display:flex;flex-direction:column;flex:1;width:100%;min-width:0}
.map-selection>.sel-empty{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:40px 22px}
.map-selection .sel-body>.text-button:last-child{margin-top:auto}
.sel-name{font-size:22px;font-weight:500;letter-spacing:.02em;margin-top:12px}
.sel-code{display:block;font:11px var(--mono);color:var(--secondary);margin-top:12px;letter-spacing:.06em}
.sel-since{display:block;font:10px var(--mono);color:var(--muted);margin-top:7px;letter-spacing:.05em}
.sel-body .tag{margin-top:14px}
.sel-return{font:40px var(--mono);letter-spacing:-.065em;margin-top:26px}
.sel-hint{font-size:10px;color:var(--muted);display:block;margin-top:2px}
.sel-meta{border:1px solid var(--line);border-radius:var(--radius);padding:3px 14px;margin:18px 0 0}
.sel-meta>div{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:11px 0}
.sel-meta>div+div{border-top:1px solid var(--line)}
.sel-meta dt{font-size:10px;color:var(--muted);white-space:nowrap}
.sel-meta dd{margin:0;font-size:13px;font-family:var(--mono);text-align:right}
.sel-meta dd small{display:block;font:8px var(--mono);color:var(--muted);margin-top:2px}
.sel-missing{font-size:12px;line-height:1.9;color:var(--secondary);margin-top:16px;border-left:2px solid var(--accent);padding:10px 14px;background:var(--raised)}
.sel-latest{margin-top:14px;font-size:11px;line-height:1.8;color:var(--secondary);border:1px solid var(--line);padding:10px 13px;border-radius:3px}
.sel-latest b{font-weight:500;color:var(--text)}
.sel-episodes-title{margin-top:20px;font-size:10px;color:var(--muted);letter-spacing:.08em}
.map-episode{border:1px solid var(--line);border-radius:var(--radius);padding:12px 13px;margin-top:10px;transition:border-color .2s}
.map-episode:hover{border-color:rgba(var(--accent-rgb),.35)}
.map-episode-head{display:flex;align-items:baseline;gap:8px;font-size:12px;flex-wrap:wrap}
.map-episode-head b{font-weight:400;font-family:var(--mono);letter-spacing:-.02em}
.map-episode-head .map-episode-type{font-size:9px;color:var(--muted);border:1px solid var(--line);padding:2px 6px;border-radius:3px;font-weight:400}
.map-episode-head b:last-child{margin-left:auto}
.map-episode-meta{display:block;margin:9px 0 4px}
.map-episode-meta div{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:4px 0}
.map-episode-meta dt{font-size:10px;color:var(--muted);white-space:nowrap}
.map-episode-meta dd{margin:0;font-size:11px;color:var(--secondary);text-align:right}
.tag.invalid-pill{color:var(--down);border-color:rgba(var(--down-rgb),.45);background:rgba(var(--down-rgb),.07);display:inline-flex;align-items:center;gap:5px;font-size:10px;padding:2px 8px}
.tag.invalid-pill:before{content:"✕";font-size:9px}
.map-episode.is-invalid .map-episode-head b:last-child{opacity:.9}
.sel-note{font-size:12px;line-height:1.9;color:var(--secondary);margin-top:12px}
.sel-empty{padding:60px 22px}
/* 提示浮层 */
.tooltip{position:fixed;z-index:90;display:none;background:var(--raised);border:1px solid var(--line);border-radius:4px;padding:10px 13px;font-size:11px;line-height:1.6;color:var(--secondary);max-width:280px;pointer-events:none;box-shadow:0 14px 44px #000a}
.tooltip b{color:var(--text);font-weight:500}
.tooltip dl{margin:8px 0 0}
.tooltip dl div{display:flex;justify-content:space-between;gap:14px;margin-top:4px}
.tooltip dt{color:var(--muted);font-size:10px}
.tooltip dd{margin:0;font-family:var(--mono);font-size:11px;color:var(--text)}
.tooltip dd.up{color:var(--up)}.tooltip dd.down{color:var(--down)}
.tip-hint{margin-top:6px;font-size:9px;color:var(--muted)}
/* 空态与页脚 */
.empty{padding:50px 25px;color:var(--muted);text-align:center}
.empty h2{font-size:17px;font-weight:500;color:var(--text);margin-bottom:8px}
.empty p{font-size:12px;line-height:1.9}
.footer{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:10px;padding:24px 0 0;margin-top:26px;border-top:1px solid var(--line);gap:20px}
.footer strong{font-weight:400;color:var(--secondary)}
.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--raised);border:1px solid var(--line);padding:10px 20px;border-radius:6px;font-size:12px;opacity:0;transition:all .2s;z-index:100;pointer-events:none;max-width:90vw}

<script>
/* A 黑白仪表台 · 总览工作台＋观察星图 主用页面。
 * 只读本页内嵌的冻结快照：显示口径与正式页 rules.js/core.js 一致
 * （exact-date 收盘、regular_detail 详评名单、相邻复盘方向切换、星图同股合并）。
 * 星图版式为黑白仪表台，点位配色保留正式页口径：涨（≥参考价）红点、跌绿点。
 * 无网络请求、无研究判断；提供原推荐、完整复盘、公司资料、收藏与搜索。 */
(()=>{'use strict';
const DATA=JSON.parse(document.getElementById('snapshot').textContent);
const $=id=>document.getElementById(id);
const valid=n=>typeof n==='number'&&Number.isFinite(n);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const number=(n,d=2)=>valid(n)?n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}):'—';
const pct=n=>valid(n)?`${n>0?'+':''}${n.toFixed(2)}%`:'—';
const tone=n=>valid(n)?(n>0?'up':n<0?'down':'muted'):'muted';
const key=s=>`${s.code}:${s.recDate}`;
const motion=matchMedia('(prefers-reduced-motion: reduce)').matches;
document.body.classList.toggle('motion',!motion);
/* ---- 交易日定位：完整 ISO 序列；旧 MM-DD 序列明确拒绝，不猜年份。 ---- */
const ISO=/^\d{4}-\d{2}-\d{2}$/;
function resolveDates(d){
  const analysis=d.analysis_date;
  if(typeof analysis!=='string'||!ISO.test(analysis))throw new Error('analysis_date 必须是 YYYY-MM-DD');
  const raw=d.dates;
  if(!Array.isArray(raw)||!raw.length)throw new Error('快照缺少非空 dates 交易日序列');
  let out;
  if(Array.isArray(d.sessionDates)){
    if(d.sessionDates.length!==raw.length)throw new Error('sessionDates 与 dates 长度不一致');
    out=d.sessionDates.map(String);
  }else if(raw.every(x=>typeof x==='string'&&ISO.test(x))){out=raw.slice();}
  else{throw new Error('旧 MM-DD 序列无法证明年份；请从原归档重新生成展示数据');}
  if(out[out.length-1]!==analysis)throw new Error('日期序列末日与 analysis_date 不一致');
  for(let i=1;i<out.length;i++)if(out[i]<=out[i-1])throw new Error('日期序列不是严格递增');
  return out;
}
const SESSIONS=resolveDates(DATA);
const LAST=DATA.dates.length-1;
const indexOfDate=iso=>SESSIONS.indexOf(iso);
/* ---- 显示规则：与正式页 rules.js 同口径 ---- */
const POLICY=DATA.observationPolicy||{};
const OBS_DAYS=valid(POLICY.primaryDays)&&POLICY.primaryDays>0?POLICY.primaryDays:20;
const OBS_TARGET=valid(POLICY.targetReturn)?POLICY.targetReturn:0.2;
const targetPrice=s=>valid(s.ref)?s.ref*(1+OBS_TARGET):null;
function orderedReviews(s,date){return (s.reviews||[]).filter(r=>r.date<=date).slice().sort((a,b)=>a.date.localeCompare(b.date)||(a.as_of||'').localeCompare(b.as_of||''));}
function latest(s){return orderedReviews(s,DATA.analysis_date).at(-1)||null;}
function recommendations(){return [...DATA.stocks].sort((a,b)=>b.recDate.localeCompare(a.recDate));}
function deepReviews(){
  const rawLimit=DATA.presentation?.deepLimit;
  const limit=valid(rawLimit)?Math.min(8,Math.max(0,Math.floor(rawLimit))):8;
  const supplied=DATA.dailyDeepReview;
  const candidates=DATA.stocks.flatMap(s=>{
    const r=latest(s);
    return r?.date===DATA.analysis_date&&r.review_kind==='regular_detail'&&!s.d0?[{s,r}]:[];
  });
  let ordered=candidates;
  if(supplied){
    const keys=supplied.date===DATA.analysis_date?(supplied.recordKeys||[]):[];
    ordered=keys.map(k=>candidates.find(x=>key(x.s)===k)).filter(Boolean);
  }
  const groups=[];
  for(const x of ordered){
    let group=groups.find(g=>g.code===x.s.code);
    if(!group){group={code:x.s.code,records:[]};groups.push(group);}
    if(!group.records.some(y=>key(y.s)===key(x.s)))group.records.push(x);
  }
  return {groups:groups.slice(0,limit),source:supplied?'当日上游详评名单':'当日 regular_detail 标记'};
}
const BASE_DIRECTIONS={'未来1—3个交易日更可能震荡偏强':'up','未来1—3个交易日更可能继续走强':'up',
 '未来1—3个交易日更可能横盘整理或等待新变化':'sideways','未来1—3个交易日更可能震荡偏下':'down',
 '未来1—3个交易日更可能继续偏弱':'down','未来1—3个交易日更可能高位剧烈波动并出现回吐':'down'};
const OUTLOOK_CODE_DIRECTION={strengthening:'up',continuation_possible:'up',range_or_wait:'sideways',
 weakening:'down',overheated:'down',invalidated:'down'};
const DIRECTION_LABELS={up:'上涨',sideways:'横盘',down:'下跌'};
function direction(r){
  if(!r)return null;
  if(Object.prototype.hasOwnProperty.call(r,'outlookDirection'))
    return DIRECTION_LABELS[r.outlookDirection]?r.outlookDirection:null;
  if(Object.prototype.hasOwnProperty.call(r,'outlookCode'))
    return OUTLOOK_CODE_DIRECTION[r.outlookCode]??null;
  return BASE_DIRECTIONS[r.base]||null;
}
function directionUpdates(data=DATA){
  const end=data.analysis_date;
  return recommendations(data).flatMap(s=>{
    const rows=orderedReviews(s,end),r=rows.at(-1);
    if(!r||r.date!==end)return [];
    const previous=rows.filter(x=>x.date<r.date).at(-1);
    const from=direction(previous),to=direction(r);
    if(!from||!to||from===to)return [];
    return [{s,r,previous,from,to,reason:r.viewReason||r.outlookReason||'',
      fromLabel:DIRECTION_LABELS[from],toLabel:DIRECTION_LABELS[to]}];
  });
}
function isInvalid(s){
  if(typeof s.invalidated==='boolean')return s.invalidated;
  const r=latest(s);
  if(r){
    if(r.viewChange==='invalidated'||r.assessmentCode==='contradicted')return true;
    if(Object.prototype.hasOwnProperty.call(r,'viewChange')&&r.viewChange!=null&&r.viewChange!=='invalidated')return false;
    return r.viewLabel==='判断失效'||r.assessmentText==='推荐后的事实与核心预期相反';
  }
  return ['原判断失效','判断失效'].includes(s.stage);
}
const VIEW_CHANGE_CODES={strengthened:'strengthened',weakened:'weakened',unchanged:'maintained',first_review:'first',invalidated:'invalidated'};
const LEGACY_VIEW_LABELS={'观点增强':'strengthened','观点减弱':'weakened','维持原判断':'maintained','维持原判':'maintained','首次复盘':'first','判断失效':'invalidated'};
function viewCode(r){
  if(!r)return null;
  if(Object.prototype.hasOwnProperty.call(r,'viewChange')){
    const v=r.viewChange;
    return v==null||v===''?null:VIEW_CHANGE_CODES[v]||'unrecognized';
  }
  return LEGACY_VIEW_LABELS[r.viewLabel]||null;
}
function opinionLabel(s){
  if(isInvalid(s))return '判断失效';
  const code=viewCode(latest(s));
  return {strengthened:'观点增强',weakened:'观点减弱',maintained:'维持原判',first:'首次复盘'}[code]
    ||(code==='unrecognized'?'未识别状态':'尚未复盘');
}
const OPINION_OPTIONS=Object.freeze([
 {value:'any',label:'全部复盘观点'},{value:'strengthened',label:'观点增强'},{value:'weakened',label:'观点减弱'},
 {value:'maintained',label:'维持原判'},{value:'first',label:'首次复盘'},{value:'unreviewed',label:'尚未复盘'}]);
function opinionCode(s){
 if(isInvalid(s))return 'invalidated';
 const code=viewCode(latest(s));
 return ['strengthened','weakened','maintained','first'].includes(code)?code
  :code==='unrecognized'?'unrecognized':'unreviewed';
}
function defaultFilters(){return {scope:'default',positive:false,opinion:'any'};}
function filterAction(f,action,value){
 if(action==='all')return {...defaultFilters(),scope:'active'};
 if(action==='reset')return defaultFilters();
 if(action==='invalid')return {...f,scope:({default:'invalid',invalid:'default',active:'both',both:'active'})[f.scope]||'invalid',opinion:'any'};
 if(action==='positive')return {...f,positive:!f.positive};
 if(action==='opinion'){const known=OPINION_OPTIONS.some(x=>x.value===value);return {...f,opinion:known?value:'any',scope:value!=='any'?'active':f.scope};}
 return {...f};
}
function filterRecords(data,f){return recommendations(data).filter(s=>{
 const bad=isInvalid(s);
 if(f.scope==='invalid'&&!bad)return false;
 if(!['invalid','both'].includes(f.scope)&&bad)return false;
 const ret=returnOnDate(s);
 if(f.positive&&(ret===null||ret<=0))return false;
 if(f.opinion!=='any'&&opinionCode(s)!==f.opinion)return false;
 return true;
});}
function closeOnDate(s){
  const i=indexOfDate(DATA.analysis_date);if(i<0)return null;
  const close=s.candles[i]?.[3];return valid(close)?close:null;
}
function returnOnDate(s){
  const close=closeOnDate(s),i=indexOfDate(DATA.analysis_date);
  return s.d0||!valid(s.ref)||s.ref<=0||close===null||i<(s.recIndex??0)?null:(close/s.ref-1)*100;
}
function daysAt(s){return s.d0?0:Math.max(0,Math.min(s.days,LAST-s.recIndex+1));}
function outlookText(r){
  if(!r)return '尚无复盘观点';
  const d=direction(r);
  return valid(d)?DIRECTION_LABELS[d]:'未识别状态';
}
function dateWord(s){return s.formedOn?{d:s.formedOn,w:'推荐'}:{d:s.recDate,w:'入选'};}
/* ---- 市场卡片 ---- */
const INDEX_META={'000001.SH':{name:'上证指数',description:'沪市市场观察'},'399001.SZ':{name:'深证成指',description:'深市市场观察'},
 '399006.SZ':{name:'创业板指',description:'创业板市场观察'},'000688.SH':{name:'科创50',description:'科创板代表指数'},
 '899050.BJ':{name:'北证50',description:'北交所市场观察'}};
function marketCards(){
  const codes=[...new Set(DATA.presentation?.marketCodes
    ||((Array.isArray(DATA.market)&&DATA.market.some(x=>x!=null))?['000001.SH']:[]))];
  const i=indexOfDate(DATA.analysis_date);
  return codes.map(code=>{
    let row=(DATA.marketIndices||[]).find(x=>x.code===code);
    if(!row&&code==='000001.SH'&&DATA.market_name==='上证指数'&&i>=0){
      row={code,name:DATA.market_name,trade_date:DATA.analysis_date,close:DATA.market[i],previousClose:DATA.market[i-1],
        series:DATA.market.slice(0,i+1),source:'上传报告 market 价格序列'};
    }
    const meta=INDEX_META[code]||{},fresh=row?.trade_date===DATA.analysis_date;
    const close=fresh&&valid(row?.close)?row.close:null;
    const previousClose=fresh&&valid(row?.previousClose)&&row.previousClose>0?row.previousClose:null;
    const changePct=close!==null&&previousClose!==null?(close/previousClose-1)*100:null;
    return {code,name:row?.name||meta.name||code,description:row?.description||meta.description||'研究市场基准',
      close,previousClose,changePct,change:close!==null&&previousClose!==null?close-previousClose:null,
      series:fresh?(row?.series||[]):[],trade_date:row?.trade_date||null,
      status:close!==null?'available':row&&!fresh?'stale':'missing'};
  });
}
/* ---- 观察星图：同股合并与坐标派生（与正式页 rules.js 同口径，仅展示层） ---- */
const ATLAS_BASIS_LABEL='本报告最早记录';
function atlasGroups(){
  const byCode=new Map();
  for(const s of DATA.stocks){
    let g=byCode.get(s.code);
    if(!g){g={code:s.code,name:s.name,records:[]};byCode.set(s.code,g);}
    if(!g.records.some(x=>key(x)===key(s)))g.records.push(s);
  }
  const groups=[...byCode.values()];
  for(const g of groups)g.records.sort((a,b)=>a.recDate.localeCompare(b.recDate));
  groups.sort((a,b)=>a.records[0].recDate.localeCompare(b.records[0].recDate));
  return groups;
}
function atlasGroupClose(records){
  const i=indexOfDate(DATA.analysis_date);if(i<0)return null;
  for(const s of records){const c=s.candles[i]?.[3];if(valid(c))return c;}
  return null;
}
function atlasPlottable(s,close){
  if(s.d0)return '待首日观察';
  if(!valid(s.ref)||s.ref<=0)return '缺参考价';
  const i=indexOfDate(DATA.analysis_date);
  if(!valid(s.recIndex)||s.recIndex<0||s.recIndex>i)return '交易日历不足';
  if(!valid(close))return '报告日无真实收盘';
  return null;
}
function atlasBasis(group){
  const anchor=group.records[0],close=atlasGroupClose(group.records),reason=atlasPlottable(anchor,close);
  if(reason)return {anchor,close,plottable:false,reason,ret:null,day:null};
  const i=indexOfDate(DATA.analysis_date);
  return {anchor,close,plottable:true,reason:null,ret:(close/anchor.ref-1)*100,day:i-anchor.recIndex+1};
}
function atlasRecordPoint(s,group){
  const close=atlasGroupClose(group.records),reason=atlasPlottable(s,close);
  if(reason)return {s,close,plottable:false,reason,ret:null,day:null};
  const i=indexOfDate(DATA.analysis_date);
  return {s,close,plottable:true,reason:null,ret:(close/s.ref-1)*100,day:i-s.recIndex+1};
}
function atlasBadge(group){
  const n=group.records.length;if(n<2)return null;
  const pending=group.records.filter(s=>s.d0).length,events=group.records.filter(s=>s.refKind==='event').length,tags=[];
  if(events===n)tags.push('条件观察');else if(events)tags.push('含条件观察');
  if(pending)tags.push(`含${pending}次待首日`);
  return {count:n,short:`入选 ${n} 次`,full:`入选 ${n} 次`+(tags.length?` · ${tags.join(' · ')}`:'')};
}
function atlasRange(stockPoints,recordPoints){
  const rets=[],days=[];
  for(const p of [...stockPoints,...recordPoints])if(p.plottable){rets.push(p.ret);days.push(p.day);}
  if(!rets.length)return null;
  let lo=Math.min(0,...rets),hi=Math.max(0,...rets);
  const pad=Math.max((hi-lo)*.18,1.2);lo-=pad;hi+=pad;
  return {lo,hi,maxDay:Math.max(...days,1),basis:ATLAS_BASIS_LABEL};
}
function atlasData(){
  const groups=atlasGroups();
  const stock=groups.map(g=>({group:g,badge:atlasBadge(g),basis:atlasBasis(g)}));
  const record=[];
  for(const g of groups)for(const s of g.records)record.push({group:g,s,point:atlasRecordPoint(s,g)});
  return {groups,stock,record,range:atlasRange(stock.map(x=>x.basis),record.map(x=>x.point))};
}

function groupPanel(item){

    <button class="text-button" data-open="${key(s)}">查看这次复盘 →</button></div>`;}).join('');

  ${badge?`<span class="tag accent">${esc(badge.full)}</span>`:''}
  <div class="sel-return num ${tone(basis.ret)}">${pct(basis.ret)}</div>
  ${basis.plottable?`<dl class="sel-meta"><div><dt>最早记录原参考价</dt><dd>¥ ${number(anchor.ref)}</dd></div><div><dt>报告日收盘</dt><dd>¥ ${number(basis.close)}<small>${DATA.analysis_date}</small></dd></div><div><dt>距最早入选</dt><dd>第 ${basis.day} 个交易日</dd></div></dl>`
  :`<p class="sel-missing">最早基准无法计算：${esc(basis.reason)}。不换用最新参考价，也不按 0% 绘制；明细中仍可阅读各次记录。</p>`}
  ${latest&&latestPoint&&latestPoint.plottable?`<div class="sel-latest"><b>最新一次 ${latest.recDate.replaceAll('-','.')}</b>：自己的涨跌 <b class="num ${tone(latestPoint.ret)}">${pct(latestPoint.ret)}</b>（第 ${latestPoint.day} 个交易日，较该次参考价 ${number(latest.ref)}）。单列阅读，不替换主图基准。</div>`:''}
  <div class="sel-episodes-title">全部入选明细 · 按时间顺序</div>${episodes}</div>`;
}
function recordPanel(s){

  <dl class="sel-meta"><div><dt>观察进度</dt><dd>${s.d0?'待首日观察':`第 ${daysAt(s)} 天 / ${OBS_DAYS}`}</dd></div><div><dt>${dateWord(s).w}日期</dt><dd>${dateWord(s).d}</dd></div><div><dt>本期成交额</dt><dd>${eq&&valid(eq[4])?number(eq[4])+' 亿':'—'}</dd></div></dl>

  <p class="sel-note">${esc(r?.viewReason||(s.reasonFull?s.reasonFull.slice(0,90)+'…':'原报告未填写复盘说明。'))}</p>
  <button class="text-button" data-open="${key(s)}">阅读完整复盘 →</button></div>`;
}
function updateMapPanel(){const el=$('mapSelection');if(el)el.innerHTML=mapPanelContent()}
function updateMapMeta(a){
  const stockView=state.mapMode==='stock',stats=$('mapStats'),pending=$('mapPending');
  if(stats){
    const M=DATA.stocks.length,Z=stockView?a.stock.filter(x=>x.basis.plottable).length:a.record.filter(x=>x.point.plottable).length,T=stockView?a.stock.length:a.record.length,K=T-Z;
    stats.textContent=stockView?`${a.stock.length}只股票 · ${M}条入选记录 · ${Z}只有坐标 · ${K}只暂未绘制`:`${a.groups.length}只股票 · ${M}条入选记录 · ${Z}条有坐标 · ${K}条暂未绘制`;
  }
  if(pending){
    const rows=stockView?a.stock.filter(x=>!x.basis.plottable).map(item=>`<button class="map-pending-item" data-map-group="${esc(item.group.code)}"><b>${esc(item.group.name)}</b><span>${item.group.code} · 最早入选：${esc(item.basis.reason)}</span></button>`).join('')
      :a.record.filter(x=>!x.point.plottable).map(x=>`<button class="map-pending-item" data-map-id="${esc(key(x.s))}"><b>${esc(x.s.name)}</b><span>${x.s.recDate.replaceAll('-','.')} · ${esc(x.point.reason)}</span></button>`).join('');
    pending.innerHTML=rows?`<div class="map-pending"><span class="map-pending-title">暂未绘制 · 点击查看原因与明细</span><div class="map-pending-list">${rows}</div></div>`:'';
  }
}
function drawAtlas(){
  const wrap=$('atlasWrap');if(!wrap)return;
  const a=atlasData(),stockView=state.mapMode==='stock';
  updateMapMeta(a);
  const W=Math.max(320,wrap.clientWidth||900),H=Math.max(360,wrap.clientHeight||(window.innerWidth<=720?400:520)),small=W<500,pad={l:small?46:56,r:small?22:44,t:34,b:46};
  let dots=[];
  let out='';
  if(a.range){
    const {lo,hi,maxDay}=a.range,plotW=W-pad.l-pad.r,plotH=H-pad.t-pad.b;
    const x=day=>pad.l+(maxDay>1?(day-1)/(maxDay-1):.5)*plotW,y=ret=>H-pad.b-(ret-lo)/(hi-lo)*plotH;
    out=`<defs><pattern id="atlas-dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".6" fill="var(--muted)" opacity=".22"/></pattern></defs><rect x="${pad.l}" y="${pad.t}" width="${plotW}" height="${plotH}" fill="url(#atlas-dots)"/>`;
    for(let j=0;j<=4;j++){
      const v=lo+(hi-lo)*j/4,zero=Math.abs(v)<1e-9,yy=y(v).toFixed(1);
      out+=`<line x1="${pad.l}" x2="${W-pad.r}" y1="${yy}" y2="${yy}" stroke="${zero?'var(--secondary)':'var(--line)'}" stroke-dasharray="${zero?'5 5':'2 6'}" opacity="${zero?.55:.9}"/><text x="${pad.l-9}" y="${Number(yy)+3}" text-anchor="end" fill="var(--muted)" font-size="${small?8:9}" font-family="var(--mono)">${v>0?'+':''}${v.toFixed(1)}%</text>`;
    }
    const step=maxDay>24?5:2;
    for(let d=2;d<=maxDay;d+=step){
      const xx=x(d).toFixed(1);
      out+=`<line x1="${xx}" x2="${xx}" y1="${pad.t}" y2="${H-pad.b}" stroke="var(--line)" opacity=".7"/><text x="${xx}" y="${H-pad.b+20}" text-anchor="middle" fill="var(--muted)" font-size="9" font-family="var(--mono)">${d}</text>`;
    }
    const axisY=stockView?'较最早记录参考价涨跌':'较该次入选参考价涨跌';
    const axisX=stockView?`自${ATLAS_BASIS_LABEL}的首个观察日起的交易日 →`:'自该次入选的首个观察日起的交易日 →';
    out+=`<line x1="${pad.l}" x2="${W-pad.r}" y1="${y(0).toFixed(1)}" y2="${y(0).toFixed(1)}" stroke="var(--secondary)" stroke-dasharray="5 5" opacity=".5"/>`
      +`<text x="${pad.l}" y="16" fill="var(--muted)" font-size="9">${axisY}</text><text x="${W-pad.r}" y="${H-5}" text-anchor="end" fill="var(--muted)" font-size="9">${axisX}</text>`;
    const iLast=indexOfDate(DATA.analysis_date);
    if(stockView)for(const item of a.stock){
      if(!item.basis.plottable)continue;
      const amt=item.group.records.map(s=>s.candles[iLast]?.[4]).find(valid);
      dots.push({id:item.group.code,attr:'data-map-group',rec:item.group.records[0],name:item.group.name,label:item.group.name,badge:item.badge?.short||null,day:item.basis.day,ret:item.basis.ret,amt:valid(amt)?amt:0,active:item.group.code===state.mapGroup});
    }else for(const x0 of a.record){
      const p=x0.point;if(!p.plottable)continue;
      const amt=x0.s.candles[iLast]?.[4];
      dots.push({id:key(x0.s),attr:'data-map-id',rec:x0.s,name:x0.s.name,label:atlasRecordLabel(x0.s),badge:null,day:p.day,ret:p.ret,amt:valid(amt)?amt:0,active:key(x0.s)===state.mapCurrent});
    }
    /* 窄屏只给选中点配标签（置于最上层），密集处不硬塞文字；桌面保持完整碰撞避让。 */
    const placed=[],labelY=Array(dots.length).fill(null),sideR=Array(dots.length).fill(false);
    const order=dots.map((_,i)=>i).sort((i,j)=>((dots[j].badge?2:0)+(dots[j].active?1:0))-((dots[i].badge?2:0)+(dots[i].active?1:0)));
    for(const i of order){
      if(small&&!dots[i].active)continue;
      const d0=dots[i],xx=x(d0.day),yy=y(d0.ret),radius=d0.amt>0?Math.min(small?10:13,3+Math.sqrt(d0.amt)*1.15):3.5,fs=small?8:10;
      const w=d0.label.length*fs+(d0.badge?d0.badge.length*(fs-1)+23:0);
      const rightX=xx+radius+8,leftX=xx-radius-8-w;
      const side=rightX>=pad.l-8&&rightX+w<=W-2?true:leftX>=pad.l-8&&leftX+w<=W-2?false:null;
      if(side===null)continue;
      const x1=side?rightX:leftX;sideR[i]=side;
      for(const dy of[0,-12,12]){
        const ty=yy-8+dy;
        if(!placed.some(r=>x1<r.x2&&x1+w>r.x1&&ty-10<r.y2&&ty+2>r.y1)){placed.push({x1,x2:x1+w,y1:ty-10,y2:ty+2});labelY[i]=ty;break;}
      }
    }
    const labelMarkup=(d0,i,fs)=>{
      if(labelY[i]==null)return '';
      const xx=x(d0.day),yy=y(d0.ret),radius=d0.amt>0?Math.min(small?10:13,3+Math.sqrt(d0.amt)*1.15):3.5;
      const nameW=d0.label.length*fs,anchor=sideR[i]?'start':'end',tx=sideR[i]?xx+radius+8:xx-radius-8;
      let s=`<text x="${tx.toFixed(1)}" y="${labelY[i].toFixed(1)}" text-anchor="${anchor}" fill="var(--secondary)" font-size="${fs}">${esc(d0.label)}</text>`;
      if(d0.badge){
        const bw=d0.badge.length*(fs-1)+16,bx=sideR[i]?tx+nameW+7:tx-nameW-7-bw,by=labelY[i]-10;
        s+=`<g class="map-badge"><rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${bw}" height="14" rx="7" fill="var(--accent)" fill-opacity=".14" stroke="var(--accent)" stroke-opacity=".5"/><text x="${(bx+bw/2).toFixed(1)}" y="${(by+10).toFixed(1)}" text-anchor="middle" fill="var(--accent)" font-size="${small?8:9}">${esc(d0.badge)}</text></g>`;
      }
      return s;
    };
    dots.forEach((d0,i)=>{
      const xx=x(d0.day),yy=y(d0.ret),radius=d0.amt>0?Math.min(small?10:13,3+Math.sqrt(d0.amt)*1.15):3.5,col=d0.ret>=0?'var(--up)':'var(--down)',fs=small?8:10;
      out+=`<g class="map-dot" ${d0.attr}="${esc(d0.id)}" tabindex="0" role="button" aria-label="${esc(d0.name)}，${d0.badge?esc(d0.badge)+'，':''}第${d0.day}个交易日，较参考价${pct(d0.ret)}">`
        +`<circle cx="${xx.toFixed(1)}" cy="${yy.toFixed(1)}" r="${(radius+9).toFixed(1)}" fill="${col}" opacity=".06"/>`
        +`<circle cx="${xx.toFixed(1)}" cy="${yy.toFixed(1)}" r="${(radius+4).toFixed(1)}" fill="none" stroke="${col}" stroke-opacity="${d0.active?.55:.12}"/>`
        +`<circle cx="${xx.toFixed(1)}" cy="${yy.toFixed(1)}" r="${radius.toFixed(1)}" fill="${col}" fill-opacity="${d0.active?.7:.35}" stroke="${col}" stroke-opacity=".8" stroke-width=".9"/>`
        +`<circle cx="${xx.toFixed(1)}" cy="${yy.toFixed(1)}" r="1.5" fill="${col}"/>`
        +(small?'':labelMarkup(d0,i,fs))+'</g>';
    });
    if(small)dots.forEach((d0,i)=>{if(d0.active)out+=labelMarkup(d0,i,small?8:10)});
    /* 零线说明：优先放虚线左端，与点标签碰撞时换右端，两端都碰撞则省略（虚线本身始终可见）。 */
    const zeroText=stockView?'零线＝该记录原参考价':'零线＝该次原参考价',zw=zeroText.length*8,zy2=y(0);
    const cand=[{x1:pad.l+10,x2:pad.l+10+zw,ty:zy2-9},{x1:W-pad.r-4-zw,x2:W-pad.r-4,ty:zy2-9}];
    const spot=cand.find(c=>!placed.some(r=>c.x1<r.x2&&c.x2>r.x1&&c.ty-10<r.y2&&c.ty+2>r.y1));
    if(spot)out+=`<text x="${spot.x1.toFixed(1)}" y="${spot.ty.toFixed(1)}" fill="var(--muted)" font-size="8" opacity=".7">${zeroText}</text>`;
  }else{
    out=`<text x="40" y="70" fill="var(--muted)" font-size="11">暂无可计算的坐标记录</text>`;
  }
  wrap.innerHTML=`<svg id="atlas" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="观察星图散点图：横向为入选后的交易日数，纵向为较参考价涨跌；红点高于参考价，绿点低于参考价">${out}</svg>`;
  if(!a.range)return;
  const svg=$('atlas');
  svg.onpointermove=e=>{
    const dot=e.target.closest('.map-dot');if(!dot){hideTip();return}
    const id=stockView?dot.dataset.mapGroup:dot.dataset.mapId,d0=dots.find(z=>z.id===id);if(!d0)return;
    showTip(`<b>${esc(d0.name)} · ${dateWord(d0.rec).d}${stockView?` · ${ATLAS_BASIS_LABEL}`:''}</b><dl><div><dt>自${stockView?'最早记录':'该次入选'}首个观察日起</dt><dd>第 ${d0.day} 天</dd></div><div><dt>较参考价</dt><dd class="${tone(d0.ret)}">${pct(d0.ret)}</dd></div><div><dt>当日成交额</dt><dd>${d0.amt>0?`${number(d0.amt)} 亿`:'缺失，用固定小圆'}</dd></div></dl><div class="tip-hint">${d0.active?'已固定选中':'点击固定选中'+(stockView?'这只股票':'这次观察')}</div>`,e);
    if(state.mapPreview!==id){state.mapPreview=id;updateMapPanel()}
  };
  svg.onpointerleave=()=>{hideTip();if(state.mapPreview!==null){state.mapPreview=null;updateMapPanel()}};
}
function showTip(html,e){
  const el=$('tooltip');el.innerHTML=html;el.style.display='block';
  const w=el.offsetWidth,h=el.offsetHeight;
  el.style.left=`${Math.max(10,Math.min(window.innerWidth-w-10,e.clientX+17))}px`;
  el.style.top=`${Math.max(10,Math.min(window.innerHeight-h-10,e.clientY+15))}px`;
}
function hideTip(){$('tooltip').style.display='none'}
function render(){
  $('dateChip').textContent=`${DATA.analysis_date.replaceAll('-','.')} 收盘快照`;
  document.querySelectorAll('.side-nav [data-nav]').forEach(b=>{
    const on=b.dataset.nav===state.page;
    b.classList.toggle('active',on);
    if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');
  });
  $('main').innerHTML=state.page==='map'?atlasPage():state.page==='overview'?overviewPage():'';
  if(state.page==='map'){drawAtlas();return}
  if(window.A2Hook)window.A2Hook.onRender(state.page,false);
}
/* ---- 交互 ---- */
let toastTimer;
function notify(msg){clearTimeout(toastTimer);const t=$('toast');t.textContent=msg;t.classList.add('show');toastTimer=setTimeout(()=>t.classList.remove('show'),2400)}
document.addEventListener('click',e=>{
  const nav=e.target.closest('[data-nav]');
  if(nav){hideTip();state.page=nav.dataset.nav;window.scrollTo(0,0);render();return}
  const modeBtn=e.target.closest('[data-map-mode]');
  if(modeBtn){state.mapMode=modeBtn.dataset.mapMode;state.mapGroup=null;state.mapCurrent=null;state.mapPreview=null;window.scrollTo(0,0);render();return}
  const dot=e.target.closest('.map-dot');
  if(dot){
    if(state.mapMode==='stock')state.mapGroup=dot.dataset.mapGroup;else state.mapCurrent=dot.dataset.mapId;
    state.mapPreview=null;render();return;
  }
  const pend=e.target.closest('.map-pending-item');
  if(pend){
    if(state.mapMode==='stock')state.mapGroup=pend.dataset.mapGroup;else state.mapCurrent=pend.dataset.mapId;
    state.mapPreview=null;render();return;
  }
  const open=e.target.closest('[data-open]');
  if(open){window.A2Hook.openStock(open.dataset.open,open,null,'review');return}
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('map-dot')){
    e.preventDefault();
    if(state.mapMode==='stock')state.mapGroup=e.target.dataset.mapGroup;else state.mapCurrent=e.target.dataset.mapId;
    state.mapPreview=null;render();
  }
});
let resizeTimer;
window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{render()},150)},{passive:true});
window.GuanlanA2Rules={valid,key,orderedReviews,latest,recommendations,direction,DIRECTION_LABELS,isInvalid,opinionLabel,returnOnDate,daysAt,deepReviews,directionUpdates,OPINION_OPTIONS,opinionCode,defaultFilters,filterAction,filterRecords,closeOnDate};
window.A2Notify=notify;
render();
})();
