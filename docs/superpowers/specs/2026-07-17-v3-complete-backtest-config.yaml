  earnings:
    report_period_policy: latest_four_ended_plus_next_two_quarter_ends
    disclosure_types: [earnings_forecast, earnings_express, income_statement]
  company_event:
    lookback_calendar_days: 45
    title_is_recall_only: true
    incomplete_deep_read_decision_use: forbidden
  price_anomaly:
    universe: all_formation_day_complete_stock_trading_context
    metric: abs_relative_return_20d
    tail_fraction: 0.05
    role: recall_only_not_score
  industry_cycle:
    incomplete_inputs: record_manifest_and_fail_closed
  distress_repair:
    incomplete_inputs: record_manifest_and_fail_closed

sample_policy:
  date_selection_inputs: [trade_calendar, frozen_plan_dates]
  date_selection_must_not_use: [future_prices, future_returns, hotspots, outcomes]
  primary_extension_pooling: forbidden
  outcome_reveal_before_formation_freeze: forbidden
