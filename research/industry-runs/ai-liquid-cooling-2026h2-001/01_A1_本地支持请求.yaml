  - query_failed
  - no_record
  - unknown
  - current_snapshot_not_replayable
  outputs:
  - coverage_by_entity_and_dataset
  - history_start_end
  - available_at_semantics
  - access_or_permission_limits
- task_id: A2-T04
  name: 节点词典本地扫描
  required: true
  actions:
  - 在公司简介、主营分项、公告元数据中扫描node synonyms
  - 保存命中字段、原文上下文、fact_as_of、available_at和provider
  - 新增实体仅标lead_only
  forbidden:
  - 仅凭命中词确认产品规格、客户、供货、订单、收入或利润
  outputs:
  - new_a_share_leads
  - match_contexts
- task_id: A2-T05
  name: 公告原文入口审计
  required: true
  actions:
  - 确认公告元数据、官方URL/PDF路径与available_at
  - 区分只有标题、已有正文、下载失败、正文不可解析和真实无公告
  - 本轮不为全市场批量补全文库
  outputs:
  - document_access_status
  - targeted_read_candidates
- task_id: A2-T06
  name: 点时与可复现性
  required: true
  actions:
  - 只使用available_at <= as_of的数据
  - 保存输入清单、来源、日期、质量状态
  - 不把今天的公司关系或快照倒填过去
  outputs:
  - input_manifest
  - point_in_time_limits
