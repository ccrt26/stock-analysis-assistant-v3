created_by: chatgpt
current_stage: A1_complete_waiting_codex_A2
next_actor: codex
theme: AI数据中心液冷端到端可行性试点
precise_thesis: 高功率AI训练与推理负载提高机柜热密度，会推动从芯片、服务器、机架到机房和运维的液冷支出；但价值归属取决于接口与认证、有效供给、客户自制、第二供应商、交付验收、运行维护和替代路线。
a1_scope:
  completed:
  - 最终需求与付款人
  - V1四张图
  - 四种证据状态
  - V3七视图
  - 精确节点词典
  - 替代/自制/二供挑战
  - 第一轮上市与非上市实体线索
  - A2本地支持任务
  not_completed:
  - 本地仓库读取
  - 实体/证券代码最终映射
  - 供应关系终审
  - 订单/收入/利润/现金判断
  - 财务/估值/价格计算
  - 三道地基门最终验收
  - 股票候选或交易结论
hard_boundaries:
- 只执行A2本地支持；不得进入A3、B、C或D。
- 不得修改ChatGPT定义的theme、precise_thesis、node_id、证据等级、upgrade/invalidation语义。
- 关键词、行业/主题成员、公告标题、专利、认证只能产生待核线索，不能确认供应关系。
- 不得运行现有最终选股流程，不得输出股票推荐、目标价、仓位或交易指令。
- 不得修改现有五个股票研究Skill、src、tests、数据schema、定时任务、Forward CSV、D20口径或价格场景。
- 所有数据必须满足available_at <= as_of；当前快照不可回放时必须标注。
a2_tasks:
- task_id: A2-T01
  name: 交接与版本校验
  required: true
  actions:
