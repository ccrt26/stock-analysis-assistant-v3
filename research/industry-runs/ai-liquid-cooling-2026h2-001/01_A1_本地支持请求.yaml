  - validation_status
  - validation_errors
- task_id: A2-T02
  name: 实体与证券映射
  required: true
  actions:
  - 为中国/A股优先实体补当前名称、曾用名、英文名、子公司、品牌、上市状态、证券代码和本地company_id
  - 海外实体标记listed_overseas/private/unknown
  - 无法唯一匹配写unknown，不按名称猜
  outputs:
  - entity_master_sample
  - alias_map
  - mapping_conflicts
- task_id: A2-T03
  name: 本地数据能力审计
  required: true
  datasets_to_check:
  - company_profile
  - main_business
  - announcements_metadata
  - announcement_full_text_or_pdf_path
