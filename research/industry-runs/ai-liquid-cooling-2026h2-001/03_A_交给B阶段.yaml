relationship_ladder_definition:
  identity: 法定主体、证券代码、别名、股权和有效期
  capability: 产品/工艺/测试/标准或产线能力
  certification_or_pilot: 客户测试、标准验证、送样或试点
  supply: 进入真实客户或供应链
  order: 合同、定点、订单或中标
  repeat_delivery: 同一客户追加或跨客户批量交付
  revenue: 目标节点收入被确认并可与其他业务区分
  profit: 目标节点毛利/净利润对公司重要
  cash: 目标节点经营现金兑现且未被应收/存货吞噬
unknowns_carried_forward:
- 私有B2B客户与保密供应关系
- 关键非上市实体的统一信用代码、别名、股权与规模
- 部分产品页在as_of时点的历史可见性
- 液冷产品在多数上市公司的收入、毛利、利润和现金贡献
- 客户自制、专用接口和二供切换的实际比例
- 两相DTC与浸没路线的中期应用比例和运维经济性
- 完整搜索饱和度与个人维护成本
