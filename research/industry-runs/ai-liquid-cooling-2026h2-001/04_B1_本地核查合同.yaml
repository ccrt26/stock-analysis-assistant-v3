output_contract:
  files:
  - file: 05_B2_本地核查.json
    purpose: 完整机器事实包
    required_sections:
    - contract_compliance
    - input_manifest
    - document_chain
    - entity_results
    - derived_metrics
    - scenario_inputs
    - counterevidence
    - quality_and_unknowns
  - file: 05_B2_本地核查摘要.md
    purpose: 给用户和B3阅读的人话摘要
    required_sections:
    - 执行范围
    - 每个实体的关系门是否通过
    - 最重要的本地数字
    - 财务/现金反证
    - 估值和价格事实（允许时）
    - 数据缺口与下一步
  - file: 05_B2_数据缺口.json
    purpose: 无法取得、失败、无记录和不可回放项
    required_sections:
    - gap_id
    - entity_or_node
    - field
    - status
    - impact
    - attempted_source
    - next_action
    - must_not_infer
  - file: 00_下一步操作.md
    purpose: 将下一执行者设为ChatGPT B3并给出完整提示词
  entity_result_required_fields:
  - record_id
  - entity_name
  - ts_code
  - business_models
  - relationship_gate_result
  - document_body_results
  - company_baseline
  - theme_metrics
  - scenario_inputs
  - valuation_and_price
  - counterevidence
  - unknowns
  - quality
  - input_refs
  commit_and_push_required: true
  next_actor_after_completion: chatgpt
  next_step_after_completion: B3_semantic_acceptance
forbidden_inferences:
- 不从公司简介、行业/主题成员、公告标题、关键词、专利、认证或展会稿独立确认供货、订单或收入。
- 不把储能、汽车或通用工业液冷能力外推为AI服务器/数据中心液冷。
- 不把当前产品页或截止日后才知道的事实倒填到as_of。
- 不把公司总收入、综合毛利率或公司现金流直接当作液冷主题收入、毛利或现金。
- 不把名义产能、项目计划、框架协议、意向订单直接变成收入或利润。
- 不使用固定公司数量、综合总分、推荐阈值或代码顺序。
- 不修改A3的产业命题、节点、证据等级、关系层级、升级/失效条件；冲突另记。
- 不输出买入、卖出、目标价、仓位、止盈止损或收益承诺。
stop_conditions:
- 九条记录均返回关系门、数据质量、公司基线、主题字段状态、反证和未知。
- 所有计算可回到实际数据列、报告期、available_at、来源和输入清单。
- 920808历史代码/交易场所未规范时确认价格与估值结果为空且有明确原因。
- 条件实体未通过关系硬门时确认主题收入/利润未被计算。
- 输出四个文件并commit+push后立即停止，下一执行者为ChatGPT B3。
