global_execution_rules:
  point_in_time_and_period_alignment:
  - 只使用 available_at <= as_of 的事实；等于截止时间可用，晚于截止时间排除。
  - 公告/财报链按更正或修订 > 正式报告 > 快报 > 预告的顺序记录，但必须保留整条链和每个版本的可见时间。
  - 利润表和现金流量表的累计期只与上年同累计期比较；资产负债表同时给出上年同日和上年末比较。
  - TTM仅在四个可比季度/累计期能够无重复拼接时计算；否则写unknown，不用年度数外推。
  - 公司简介当前快照只作截止时点可见语境，不反推历史名称、历史业务和历史集团关系。
  - A3之后形成的审计记录可以证明取数过程，但不能把截止日后才出现的经营事实加入as_of。
  missing_status_definitions:
    complete: 合同要求的字段和时间边界均满足。
    partial: 有数据，但历史、字段、正文、口径或可回放性不完整。
    unsupported: 本地系统没有该能力或该字段。
    query_failed: 能力或入口存在，但本次查询/下载/解析失败。
    no_record: 查询范围和能力有效，但没有匹配记录；不等于事实不存在。
    unknown: 主体、口径或事实无法唯一确认。
    current_snapshot_not_replayable: 只有当前快照，不能重建更早状态。
    not_applicable: 该字段对该业务模式不适用。
  source_precedence:
  - priority: 1
    source: 交易所/巨潮正式公告、经审计年报/半年报、招股书及更正文件
    use: 身份、财务、主营、股权、合同/项目和正式风险。
  - priority: 2
    source: 客户或公司正式产品/技术文件、标准与测试白皮书
    use: 产品、规格、能力、认证/测试；不能越级证明订单和规模。
  - priority: 3
    source: 本地结构化财务、主营、公告元数据和点时清单
    use: 可复算数字、版本与查询质量。
  - priority: 4
    source: A3中的摘要、二手转述或当前产品页
    use: 仅定位正式原文或保留线索；不能替代正式原文。
  targeted_document_reading:
    mode: narrow_one_pass
    rule: 先用本地公告元数据和A3 evidence_ids定位少量官方原文；不扫描全市场、不建立全文库。
    body_access: 能直接取得PDF则校验PDF魔数/哈希并提取所需段落；上交所挑战页可用浏览器/官方替代入口定向读取，失败写query_failed。
    fallback: 官方原文无法取得时只确认元数据、标题、来源和时间；不得用二手摘要补合同金额、客户、条件、风险和财务影响。
    storage: 结果中保存官方URL、文档ID、时间、正文取得状态、哈希（如有）、关键摘录与证明边界；不新增长期PDF库。
  schema_mapping: Codex必须读取实际本地schema，把合同语义字段映射到真实列名并在输出记录；不得因合同列名与代码不同而静默补值。
  relationship_gate:
  - 身份、能力、认证/试点、供货、订单、重复交付、收入、利润和现金九层逐层返回。
  - 条件实体在正式关系证据前只允许查身份、产品、公告原文和公司级基线，不允许主题收入/利润估算。
  - 没有主题拆分时公司总收入、总毛利、总利润只能作为公司基线，不能成为液冷主题指标。
allowed_local_datasets:
  audited_in_A2:
  - dataset: security_master
    purpose: 证券身份、交易所、上市状态、上市日期与代码边界。
    required_semantics:
    - ts_code
    - current_name
    - legal_name_if_available
    - exchange
    - market
    - list_status
    - list_date
    - available_at
    limits: 不提供完整曾用名、旧证券代码、品牌、集团与股权历史。
  - dataset: company_profile
    purpose: 当前公司简介、经营范围、官网与主体标识，只作身份和业务语境。
    required_semantics:
    - company_id
    - current_legal_name
    - website
    - introduction
    - main_business
    - business_scope
    - snapshot_date
    - available_at
    limits: 只有当前快照，不可用于重建更早名称、业务、子公司或品牌状态。
  - dataset: main_business
    purpose: 主营分项、产品/行业/地区收入、成本与毛利线索。
    required_semantics:
    - report_period
    - item_type
    - item_name
    - revenue
    - cost
    - gross_profit_if_available
    - currency
    - available_at
    - revision
    limits: 主营名称不是客户、认证、订单或供货证明；液冷未单列时不得把大类全部视作液冷。
  - dataset: announcement
    purpose: 公告链、标题、正式URL/PDF入口、发布时间与可用时间。
    required_semantics:
    - announcement_id
    - title
    - document_type
    - published_at
    - available_at
    - provider
    - official_url_or_pdf_path
    - revision_or_correction_link
    limits: 标题和PDF入口不能代替正文；本地窗口约自2025年7月开始，不是完整历史。
  - dataset: income_statement
    purpose: 收入、成本、期间费用、营业利润、净利润、归母净利润与非经常性影响基础。
    required_semantics:
    - report_period
    - report_type
    - revenue
    - operating_cost
    - selling_expense
    - admin_expense
    - r_and_d_expense
    - finance_expense
    - operating_profit
    - total_profit
    - net_profit
    - parent_net_profit
    - available_at
    - revision
    limits: 必须按同口径报告期比较；预告、快报、正式报告和更正不得混用。
  - dataset: balance_sheet
    purpose: 应收、存货、合同资产/负债、现金、在建工程、固定资产、借款、少数股东权益等。
    required_semantics:
    - report_period
    - cash
    - accounts_receivable
    - notes_receivable
    - contract_assets
    - inventory
    - contract_liabilities
    - advance_receipts
    - construction_in_progress
    - fixed_assets
    - total_assets
    - total_liabilities
    - short_term_borrowings
    - long_term_borrowings
    - minority_interests
    - available_at
    - revision
    limits: 字段不存在、口径不适用和真实为零必须分开。
  - dataset: cash_flow
    purpose: 经营现金、销售回款、资本开支现金、融资现金及现金兑现质量。
    required_semantics:
    - report_period
    - cash_received_from_sales
    - net_operating_cash_flow
    - cash_paid_for_long_term_assets
    - net_investing_cash_flow
    - net_financing_cash_flow
    - available_at
    - revision
    limits: 累计现金流只与同口径累计期比较；不得把单季和年累计混合。
  - dataset: financial_indicator
    purpose: 毛利率、净利率、ROE、负债率、周转率、扣非净利润等已存在指标的交叉核验。
    required_semantics:
    - report_period
    - gross_margin
    - net_margin
    - roe
    - debt_ratio
    - accounts_receivable_turnover
    - inventory_turnover
    - deducted_parent_net_profit
    - available_at
    - revision
    limits: 指标表与三表冲突时保留两者并记录口径，不静默选择。
  - dataset: daily_basic
    purpose: 市值、PE/PB/PS等估值入口与实际可用历史窗口。
    required_semantics:
    - trade_date
    - close_if_available
    - total_market_value
    - circulating_market_value
    - pe_ttm
    - pb
    - ps_ttm
    - turnover_rate
    - available_at
    limits: 亏损公司PE为空或失真时不得以任意值替代；历史分位必须披露实际覆盖起止和样本数。
  - dataset: equity_daily
    purpose: 截止日行情、复权收益、波动、成交与流动性基础。
    required_semantics:
    - trade_date
    - open
    - high
    - low
    - close
    - volume
    - amount
    - adjustment_method_or_factor
    - available_at
    limits: 只用截止日及以前数据；920808.BJ旧代码/场所未规范前禁止价格计算。
  - dataset: industry_member
    purpose: 形成日有效行业归属和同类参照。
    required_semantics:
    - industry_system
    - industry_code
    - industry_name
    - valid_from
    - valid_to
    - available_at
    limits: 行业分类不能证明液冷关系。
  - dataset: theme_member
    purpose: 主题成员仅用于检查市场标签与发现偏差。
    required_semantics:
    - theme_code
    - theme_name
    - snapshot_date
    - membership_status
    - available_at
    limits: 不得用于确认产品、供货、订单或收入。
  optional_existing_only:
  - dataset_semantics: broad_market_and_industry_price_series
    purpose: 计算相对宽基市场和形成日有效行业的20/60/120/250交易日收益。
    rule: 仅在仓库已有、点时可靠且无需新增数据源时使用；否则标unsupported，不临时建设。
  - dataset_semantics: adjustment_factor_or_adjusted_price_query
    purpose: 保证跨期收益使用统一复权口径。
    rule: 必须复用仓库既有复权实现并记录公式/版本；不得自行拼接不一致价格。
common_derived_metrics:
  growth_and_margin:
  - metric: revenue_yoy
    formula: 本期营业收入 / 上年同期营业收入 - 1
    conditions: 同报告期、同币种、同合并范围；上年同期为0时返回unknown。
  - metric: parent_net_profit_yoy
    formula: 本期归母净利润 / 上年同期归母净利润 - 1
    conditions: 任一期为负或接近0时同时返回绝对变动，不只给百分比。
  - metric: gross_margin
    formula: (营业收入 - 营业成本) / 营业收入
    conditions: 与财务指标表交叉核对；冲突时保留两口径。
  - metric: gross_margin_change_pp
    formula: 本期毛利率 - 上年同期毛利率（百分点）
    conditions: 同口径。
  - metric: deducted_profit_share
    formula: 扣非归母净利润 / 归母净利润
    conditions: 归母净利润为0或负时只列绝对值与非经常损益，不计算误导比例。
  cash_and_working_capital:
  - metric: cfo_to_parent_net_profit
    formula: 经营活动现金流净额 / 归母净利润
    conditions: 归母净利润<=0时不作质量比率结论，列绝对值和方向。
  - metric: cash_collection_ratio
    formula: 销售商品、提供劳务收到的现金 / 营业收入
    conditions: 仅同累计期比较。
  - metric: accounts_receivable_growth_minus_revenue_growth
    formula: 应收账款同比增速 - 营业收入同比增速
    conditions: 应收按期末余额，收入按同累计期；同时列票据/合同资产。
  - metric: inventory_growth_minus_revenue_growth
    formula: 存货同比增速 - 营业收入同比增速
    conditions: 同时列存货结构和跌价准备（若有）。
  - metric: working_capital_intensity
    formula: (应收账款 + 合同资产 + 存货 - 合同负债 - 预收款) / TTM营业收入
    conditions: 字段缺失时不得把缺失当0；返回可计算部分和缺口。
  - metric: capex_cash
    formula: 购建固定资产、无形资产和其他长期资产支付的现金
    conditions: 若用固定资产/在建工程增加额替代，必须标明替代口径且不与现金口径混用。
  valuation_and_price:
  - metric: valuation_snapshot
    formula: 截止日总市值、流通市值、PE_TTM、PB、PS_TTM
    conditions: PE仅在TTM归母净利润为正且字段有效时使用。
  - metric: valuation_percentile
    formula: 当前估值在实际可用历史窗口中的百分位
    conditions: 必须输出窗口起止、有效样本数、空值规则；不声称固定5年/10年。
  - metric: adjusted_return_20_60_120_250
    formula: 复权收盘价在20/60/120/250个交易日的收益
    conditions: 数据不足返回partial；920808.BJ在旧代码/场所规范化前全部禁止。
  - metric: relative_return
    formula: 个股复权收益 - 同期宽基/形成日有效行业收益
    conditions: 比较序列必须点时可得；不存在则unsupported。
  - metric: liquidity_snapshot
    formula: 20日成交额中位数、换手率中位数、停牌/无报价记录
    conditions: 只作事实，不形成买入条件。
  theme_metrics_only_when_directly_disclosed:
  - metric: theme_revenue_share
    formula: 直接披露的AI数据中心液冷收入 / 公司营业收入
    conditions: 分子必须同期间、同合并范围且能排除储能/汽车/传统风冷；否则unknown。
  - metric: theme_gross_profit_share
    formula: 直接披露的液冷毛利 / 公司总毛利
    conditions: 只有收入而没有主题毛利率时不得用公司综合毛利率代替。
  - metric: incremental_net_profit_elasticity
    formula: C阶段批准的液冷新增净利润 / 基期归母净利润
    conditions: B2只提供输入，不自行估算；最终计算留到C2。
  - metric: theme_cash_contribution
    formula: 可直接归因的液冷经营现金贡献 / 公司经营现金流
    conditions: 无项目/产品现金拆分时unknown。
alert_rules:
  nature: transparent_starting_alerts_not_scores_or_gates
  rules:
  - alert: 利润—现金背离
    starting_rule: 收入/利润增长但经营现金流连续两个可比报告期恶化或为负。
    handling: 标alert，不自动否决；列应收、存货、合同资产/负债和回款解释。
  - alert: 营运资金异常
    starting_rule: 应收或存货增速连续两个可比报告期高于收入增速15个百分点以上。
    handling: 核对备货、验收、账期、发出商品和减值。
  - alert: 毛利反向
    starting_rule: 公司披露高价值产品放量，但相关或综合毛利率同比下降3个百分点以上。
    handling: 拆价格、产品结构、成本、良率和项目变更；不能直接归因。
  - alert: 扩产过快
    starting_rule: 资本开支/在建工程显著翻倍，但订单覆盖、认证、良率或利用率无同步证据。
    handling: 标记供给和融资风险；拟建产能不等于有效产能。
  - alert: 一次性利润
    starting_rule: 非经常性损益或补贴占利润30%以上。
    handling: 同时报告扣非口径，不用一次性项目支撑主题利润。
  - alert: 客户过度集中
    starting_rule: 单一客户贡献超过50%，且缺少第二客户或长期合同保障。
    handling: 提高集中风险描述，不自动否决；无数据则unknown。
business_model_templates:
  component_hardware:
    plain_name: 核心部件/硬件
    commercial_chain: 产品与规格 → 客户验证/认证 → 小批量 → 重复订单/第二客户 → 批量交付 → 收入与毛利 → 回款与现金
    required_inputs:
    - 准确产品、规格、应用场景和客户类型
    - 送样/验证/定点/认证阶段及版本
    - 批量交付、订单、复购、第二客户和故障/退货
    - 相关产品收入、ASP、成本、毛利、良率、产能和利用率
    - 应收、存货、资本开支、折旧、减值和经营现金流
    future_formula_template: 可兑现收入 = min(已验证需求, 名义产能 × 认证通过率 × 良率 × 产能利用率) × 平均售价
    b2_rule: B2只提取直接披露的变量和公司基线；任何认证率、良率、利用率或ASP缺失时写unknown，不计算虚假收入。
    counterevidence:
    - 产品同名但场景为汽车/储能/通用工业
    - 长期停留在送样/试产
    - 批量交付无复购或第二客户
    - 收入增长伴随降价、低毛利、应收或库存恶化
    - 客户扶持二供、接口标准化或客户自制
  system_equipment_project:
    plain_name: 系统设备/项目交付
    commercial_chain: 正式合同/订单 → 可交付范围 → 调试/验收 → 收入确认 → 项目毛利 → 应收/质保金 → 现金回收
    required_inputs:
    - 合同性质、金额、可取消条款、产品/项目范围和交付期限
    - 关键部件供应、项目进度、验收条件和收入确认政策
    - 在手订单、交付、验收收入、项目毛利与变更成本
    - 合同资产、应收、质保金、合同负债/预付款和现金回收
    - 项目客户集中、跨客户复制和售后责任
    future_formula_template: 项目利润链 = 正式订单 → 可交付金额 → 验收收入 → 项目毛利 → 扣除垫资、质保与融资成本后的现金回报
    b2_rule: 框架协议、意向、在手订单和收入必须分开；无法取得验收/回款条款时不把订单直接计入收入。
    counterevidence:
    - 订单长期不转收入
    - 验收延期或项目变更吞噬毛利
    - 合同资产/应收显著上升
    - 经营现金持续为负
    - 大量系统收入实为传统温控或非AI场景
  facility_side_engineering:
    plain_name: 设施侧冷源/工程改造
    commercial_chain: 数据中心设施侧项目/改造 → 设备与工程交付 → 验收 → 项目毛利 → 回款；与直接芯片液路产品分开
    required_inputs:
    - 液冷设施侧、水环、最终排热、风液混合项目与传统风冷/普通机房业务拆分
    - 项目合同、改造范围、交付验收和客户类型
    - 工程/设备收入、毛利、合同资产、应收、资本开支和现金流
    - IDC运营、传统温控和液冷工程是否混在同一分部
    future_formula_template: 可确认项目贡献 = 已明确为液冷设施侧的验收收入 × 对应项目毛利率；无法拆分时不计算主题贡献
    b2_rule: 设施侧受益不等于冷板/CDU/UQD直接供应；只按明确液冷设施水环或改造项目核查。
    counterevidence:
    - 收入主要来自传统精密空调或IDC运营
    - 没有液冷改造/设施侧合同原文
    - 工程垫资和应收吞噬利润
    - 风液混合或传统风冷路线延缓直接液冷投入
  ownership_context:
    plain_name: 持股/合并范围与利润归属
    commercial_chain: 法律主体与持股有效期 → 控制/合并方式 → 少数股东权益/权益法 → 子公司经营结果如何进入母公司报表
    required_inputs:
    - 截至as_of的持股比例、控制关系、变更日期与官方来源
    - 是否纳入合并范围、少数股东权益、关联交易和内部抵销
    - 子公司收入/净利润对母公司归母利润的实际归属方式
    - 品牌授权与产品披露主体边界
    future_formula_template: 不得使用“子公司收入/利润 × 持股比例”的简单公式替代合并会计；按正式合并口径和少数股东权益披露处理
    b2_rule: 只核对归属，不计算母公司的液冷主题收入、估值或价格结论。
    counterevidence:
    - 产品属于子公司但被重复归给母公司
    - 持股比例/控制关系在期间内变化
    - 少数股东权益或内部交易导致简单比例失真
    - 子公司不在合并范围
scenario_variable_policy:
  purpose: B2只准备C阶段所需变量，不在B阶段自行预测或给目标价。
  per_variable_output:
  - actual_or_directly_disclosed_value
  - unit
  - period
  - source_id_or_document
  - published_at
  - available_at
  - quality
  - missing_reason
  candidate_bounds:
    conservative_input_candidate: 只允许使用已实现值、已验收收入、不可撤销订单下限或公司正式披露下限。
    base_input_candidate: 只记录当前订单、历史可复算转化率、有效产能和正常交付所支持的候选值；是否采用由C1决定。
    optimistic_trigger_candidate: 只记录需要新增客户、认证、份额、价格或良率改善的触发条件；没有触发证据时不填数。
  forbidden:
  - 用行业空间、公司规划或名义产能直接填销量
  - 用公司综合毛利率替代液冷产品/项目毛利率
  - 把摘要、展会稿或互动平台数字当作正式情景输入
  - 为了制造安全边际随意砍半，或为了乐观结论倒推销量和毛利
