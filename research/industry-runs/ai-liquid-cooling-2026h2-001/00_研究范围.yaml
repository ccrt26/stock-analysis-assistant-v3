expected_horizon:
  label: half_year
  end_date: '2027-02-27'
  meaning: 用于观察产业节点、数据可得性、实体关系与证据维护成本；不是持有期或收益期限。
theme: AI 数据中心液冷端到端可行性试点
precise_thesis: 若高功率 AI 训练与推理负载持续提高机柜热密度，最终付款人将不得不增加从芯片、服务器、机架到机房和运维的液冷系统支出；但需求与利润不会平均分配，真正影响价值归属的因素包括接口与认证、有效供给、客户自制、第二供应商、交付验收、运行维护和替代路线。本试点要验证：能否用合法、可追溯、可回放的节点—实体—证据体系支持或否定这条命题；若关键关系长期无法取得、无法核验或个人维护成本过高，则缩减研究边界，而不是补猜。
purpose:
  primary: 验证热点反向穿透法在液冷这一复杂但可控方向上，能否形成个人可长期维护的最小研究闭环。
  method_questions:
  - 产业链能否在明确边界内做到有界、可审计，关键功能、接口、制造、交付、运维和替代路线不被静默遗漏。
  - 现有本地股票助手能支持哪些实体、财务、主营、公告、估值和点时数据，哪些事实仍需外部材料、授权数据或人工复核。
  - 上市与非上市实体能否统一去重，并把身份、能力、供货关系和商业规模严格分层。
  not_a_stock_selection: true
scope:
  global_technology_and_supply:
    included: true
    focus: 技术路线、系统架构、接口标准、产品与制造节点、全球供应与竞争、客户自制和替代方案。
  china_commercialization:
    included: true
    focus: 中国的项目落地、采购与交付、制造与认证、非上市企业、产业数据来源和可维护性。
  a_share_mapping:
    included: true
    focus: 只为后续识别上市实体、证券代码和本地数据可用性做准备；本步骤及 A 阶段不选股、不估值、不判断买卖时点。
final_users:
- 运行高功率 AI 训练或推理集群的云服务商、互联网平台和算力基础设施运营者。
- 建设或运营智算中心、AIDC 和高密度数据中心的电信运营商及第三方数据中心业主。
- 自建专用 AI 集群的企业、政府、科研和公共机构。
final_payer:
  primary_categories:
  - 超大规模云服务商、互联网平台及其数据中心投资主体。
  - 电信运营商、智算中心和 AIDC 的建设或运营主体。
  - 第三方数据中心业主、托管运营商及承担液冷改造资本开支的主体。
  - 为专用 AI 算力基础设施付费的企业、政府和科研机构。
  direct_buyers_not_always_final_payers:
  - 服务器整机厂、机架或液冷系统集成商。
  - 数据中心总包、机电工程和改造承包方。
  - 代最终业主采购的设备商或渠道。
  budget_types:
    capex: 新建或改造数据中心、服务器与机架、CDU、管路、换热和监控等设备及工程支出。
    opex: 运维、检测、冷却液管理、备件、清洗、更换、监控和服务支出。
    r_and_d: 样机、测试、认证、兼容性验证和新技术路线研发支出。
  boundary_note: 研究必须区分最终决定预算的人、直接采购人和第一层/第二层收款人，不把中间采购方自动当成最终付款人。
system_start:
  definition: 从高功率 AI 训练与推理设备产生的热量，以及最终使用者为保证设备安全、稳定、连续运行而必须完成的热量转移、分配、排散、监测和维护需求开始。
  first_questions:
  - 哪些工作负载和机柜条件使传统风冷或单点散热方案不足。
  - 最终付款人为何必须购买液冷系统、工程或运维服务，而不是只购买普通制冷设备。
system_end:
  included_node_families:
  - 芯片热源、封装/TIM 与冷板接触界面。
  - 服务器内液路：冷板、管路、密封、快速接头及固定件。
  - 机架级分配：供回液歧管、阀门、软管、传感器和冗余设计。
  - CDU 及其组成：泵、换热器、过滤、膨胀/补液、变频驱动、控制与监测。
  - 机房侧水环：设施水、管道、水处理、补液、脱气及最终排热设备。
  - 漏液、温度、流量、压力监测及 BMS/DCIM/控制接口。
  - 制造、清洗、钎焊/焊接、装配、泄漏/压力/热性能/腐蚀/寿命测试和客户认证。
  - 系统设计、机房改造、集成、调试、验收和收入确认相关交付环节。
  - 运行维护：冷却液检测与更换、过滤清洗、备件、故障处理、升级改造。
  - 替代与竞争：浸没式、后门换热、风液混合、芯片效率提升、客户自制、第二供应商和潜在进入者。
  upstream_stop_rule: 当某项上游产品高度通用、AI 液冷新增需求占其总需求很小、供给弹性较高，且继续追溯不会改变需求必要性、瓶颈、利润归属、交付风险或竞争判断时停止。普通铜、铝、钢铁、基础化工、通用机床和一般电力原则上在此停止；只有出现液冷专用规格、认证、供给约束或主题增量足以改变判断时才继续。
lifecycle:
  included:
  - 需求与系统架构设计。
  - 研发、样机和技术验证。
  - 材料选择、制造、装配和质量控制。
  - 测试、接口认证和客户分阶段验证。
  - 采购、项目设计、交付、改造、调试和验收。
  - 运行、监测、维护、耗材、备件和故障处理。
  - 扩容、升级、替换和技术路线迁移。
  conditional: 退役、回收和处置只在冷却液合规、设备兼容、改造成本或资产减值会改变经济判断时纳入。
decomposition_depth:
  rule: 拆到能够独立采购或报价、独立定义规格/接口/测试、独立认证、能够对应供应商，并可能改变交付、成本、替代难度或利润归属的节点。
  continue_below_node_when:
  - 下一级工艺、材料或测试能力可能成为隐藏瓶颈。
  - 下一级决定良率、可靠性、认证周期或有效产能。
  - 下一级会改变上市与非上市供应商的竞争格局或客户自制可能性。
  do_not_decompose_for_completeness_alone: true
importance_rule:
- 遗漏后可能改变“该产品是否必须采购”的判断。
- 遗漏后可能改变交付瓶颈、认证周期或有效供给判断。
- 遗漏后可能改变价格、议价权、利润池或现金占用判断。
- 遗漏后可能改变客户自制、替代技术、第二供应商或新进入者判断。
- 遗漏后可能导致上市公司份额被高估，或非上市竞争者被忽略。
- 遗漏后可能使一条关键关系无法取得合法、可追溯、可回放的证据。
seven_view_questions:
  function_use: 系统必须完成哪些热量转移、稳定运行和安全功能，少了什么会导致 AI 设备不能交付或运行。
  physical_product: 每项功能由哪些系统、子系统、部件、材料、软件和服务完成。
  manufacturing_process: 产品怎样制造、清洗、装配和测试，哪里存在设备、工艺、良率或周期约束。
  interface_standard: 部件怎样连接、兼容、认证和验收，客户专用接口是否形成替换壁垒。
  delivery_deployment: 谁设计、集成、改造、调试和验收，订单何时转为收入和现金。
  operation_lifecycle: 运行后需要哪些监测、耗材、备件、维护、升级和故障处理。
  economics_competition: 谁付钱、谁定标准、谁自制、谁扶持二供、有哪些替代路线和潜在进入者。
exclusions:
- 本步骤不进行全网产业搜索，不读取公司或股票资料，不形成任何公司名单。
- 不输出股票推荐、目标价、仓位、止盈止损、买卖指令或收益承诺。
- 不做当前估值、K 线、价格强弱、市场拥挤或买入时点判断。
- 不把研究范围扩展为完整 AI 产业链；本轮只做液冷端到端试点。
- 不因为“热管理”“散热”“铜铝材料”等关键词就认定受益或供应关系。
- 不建设全互联网爬虫、图数据库、大平台、新数据 schema 或新增自动任务。
- 不绕过登录、验证码、访问授权、网站条款或数据许可限制。
- 不把无法取得、相互冲突或过期的事实自动估算为零、无记录或确定结论。
- 不修改现有五个股票研究 Skill、src、tests、数据 schema、定时任务、Forward CSV、D20 口径或价格场景。
unknowns:
- id: U01
  topic: 液冷技术路线与应用比例
  handling: A1 研究后按直接液冷、浸没式、后门换热和风液混合分别记录，不预设主路线。
- id: U02
  topic: 接口标准统一程度和客户专用规格
  handling: 以标准、产品规格和客户验证材料核验；无法统一时按版本和客户场景拆分。
- id: U03
  topic: 客户自制与服务器整机厂指定部件范围
  handling: 单列为竞争与可服务市场未知，不能假设全部外采。
- id: U04
  topic: 非上市企业的身份、别名、股权和真实供货规模
  handling: 按身份、能力、关系、规模四层核验；规模取不到时明确未知。
- id: U05
  topic: 私有 B2B 合同和客户保密供应关系
  handling: 只使用合法公开或授权证据；无法取得时保留未知，不用媒体或自述补齐。
- id: U06
  topic: 本地仓库对实体、主营、公告全文和历史点时的真实覆盖
  handling: 交由 Codex A2 按实际代码和本地仓库审计，不在本步骤假定。
- id: U07
  topic: 全球和中国项目在水质、气候、机房条件与交付模式上的差异
  handling: A1 按场景分层，不把一个项目参数外推到全部市场。
- id: U08
  topic: 外部数据源的许可、稳定性、更新频率和成本
  handling: 在数据源登记与 API 差距矩阵中逐项记录，必要时采用授权加少量人工或缩小范围。
- id: U09
  topic: 人工金样本和搜索饱和阈值是否适合个人维护
  handling: 作为试点起始规则验证，不把 3% 或准确率目标当永久真理。
stop_conditions:
  step_1_complete_when:
  - 三个启动文件已生成。
  - 用户阅读人话版启动说明，并回复同意、提出一项修改或停止。
  - 未开始全网产业研究、公司搜索或本地数据计算。
  pilot_research_can_close_when:
  - 七个视角中的每个关键功能和接口都有明确节点或未知占位。
  - 不存在未解释的关键孤儿节点；低影响节点可以延后但必须说明。
  - 关键节点和关键关系达到至少两个独立来源且至少一个一级来源，或被明确降级为待核。
  - 连续两轮不同来源搜索新增关键节点比例低于 3%，仅作为试点起始阈值。
  - 所有冲突、过期关系、无法取得项和复核日期已记录。
  - Codex 已完成本地数据可用性、实体映射和点时能力审计。
  - 人工抽样能够检查高影响实体和关系，且维护成本对个人可接受。
  honest_final_routes:
  - pass：关键数据可合法取得、关系核验可靠、个人维护负担可接受。
  - mixed：部分可自动，部分需要授权数据或少量人工复核。
  - reduce：关键事实长期无法取得、误判过高或维护成本过大，缩小方法边界。
user_questions:
- 能否在明确边界内建立一张有界、可审计的液冷七视图，而不是一张静态产品名单。
- 哪些功能、接口、制造、测试、交付、运维和替代节点最容易被普通产业链图遗漏。
- 哪些节点真正可能影响系统交付、替代难度、利润归属和竞争格局。
- 现有股票助手的行情、财务、主营、公告、估值和点时能力能够复用到什么程度。
- 哪些技术标准、BOM、招投标、客户供应关系、专利认证、产能项目和非上市实体仍需外部或人工核验。
- 上市与非上市实体能否按统一主体、曾用名、子公司和品牌去重，并保留有效期。
- 能否严格区分公司身份、产品能力、供货关系和商业规模，不把弱线索升级为真实供应商。
- 整个方法能否形成个人可以长期维护的最小闭环，而不建设复杂平台。
- 试点最终应给出通过、混合还是缩减，理由和下一步是什么。
