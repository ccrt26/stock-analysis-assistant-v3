source_policy:
  allowed:
  - 现有本地行情、估值、财务、主营和公告元数据
  - 交易所/公司正式公告与定期报告的按需读取
  - 已经批准的产业节点、证据和实体关系
  forbidden:
  - 用关键词或主题成员自动升级关系
  - 绕过授权、验证码或反爬限制
  - 把缺失、unknown、partial、unsupported写成0
  - 把公司总收入、综合毛利率或公司现金流当成液冷主题数值
  - 自动交易、决定仓位、给目标价或收益承诺
  point_in_time_rule: available_at <= current_monitoring_as_of；旧版本只读保留。
cadence:
  trading_day:
    silent_update:
    - 价格、市值、PE/PB/PS
    - 20日与250日复权收益
    - 相对沪深300表现
    - 停牌、流动性与公告元数据
    trigger_rule: 估值跨越自身260交易日p25/p50/p75区间，或价格与基本面发生明显背离时，只生成提示，不自动改变研究状态。
  weekly:
    checks:
    - 正式公告新增
    - 接近升级/失效条件
    - 数据源失败
    - 需要ChatGPT阅读的正文
    output: 无重大变化时并入周/月摘要，不频繁打扰用户。
  monthly:
    checks:
    - 证据是否到期
    - 关系是否需要降级复核
    - 未知项是否有新正式来源
    - 估值区间变化
    output: 月度状态摘要。
  quarterly:
    checks:
    - 财报和主营更新
    - 液冷主题收入/毛利是否首次拆分
    - 订单转收入、验收和复购
    - 经营现金、应收、存货、合同资产/负债、资本开支
    - 三情景与反向经营要求重算
    output: 季度重算与状态复核触发包。
  event:
    checks:
    - 首次正式客户/订单/批量交付
    - 追加订单、第二客户或重复项目
    - 客户否认或供应关系终止
    - 主流接口、标准或技术路线变化
    - 二供、新进入者、客户自制或有效产能变化
    - 毛利、现金、应收、存货或项目验收异常
    output: 12_D_重大触发包.yaml + 12_D_重大触发摘要.md，冻结自动状态改变并交ChatGPT。
global_financial_alerts:
  profit_cash_divergence: 收入和利润增长，但经营现金流连续两个可比报告期恶化或为负。
  working_capital: 应收或存货增速连续两个可比报告期高于收入增速15个百分点以上。
  gross_margin_reverse: 公司称高价值产品放量，但相关或综合毛利率同比下降3个百分点以上；主题口径缺失时只能标公司级提示。
  capex_too_fast: 资本开支显著增加，但订单覆盖、认证、良率和利用率没有同步证据。
  customer_concentration: 单一客户超过50%，且缺少第二客户或长期合同保障。
  rule_note: 以上是研究起始预警，不是自动否决或金融定律；Codex只触发，ChatGPT解释。
state_change_governance:
  codex_may:
  - 更新原始值
  - 计算触发条件
  - 生成触发包
  - 维护状态账和版本
  codex_must_not:
  - 自行升级/降级研究状态
  - 修改产业命题
  - 把价格触发变成交易动作
  chatgpt_may_after_trigger:
  - no_change
  - update_monitoring
  - upgrade
  - downgrade
  - invalidate
  - return_to_A
  - return_to_B
  - return_to_C
  user_approval_required: true
