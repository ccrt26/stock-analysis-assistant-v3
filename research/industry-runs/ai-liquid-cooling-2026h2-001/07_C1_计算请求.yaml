scenario_policy:
  principle: 三情景首先是三组可证伪条件；只有直接披露且期间、合并范围和场景一致的变量才能填数。
  conservative:
    name_cn: 保守情景/事实下限
    allowed:
    - 已实现值、已验收收入、正式披露下限
    - 当前已确认关系停在原证据层级
    forbidden:
    - 任意砍半制造安全边际
    - 自动年化2026H1
    - 把公司总数或混合分项当主题值
  base:
    name_cn: 基准情景/正常兑现条件
    allowed:
    - 当前订单、历史可复算转化、有效产能和正常交付能够支持的变量
    - 必须明确列出尚需出现的证据触发
    forbidden:
    - 把市场目标、行业空间或公司规划直接当基准
    - 缺失字段以0或经验值补齐
  optimistic:
    name_cn: 乐观情景/新增触发条件
    allowed:
    - 第二客户、重复订单、份额、价格、良率或现金改善的明确触发
    - 只有触发证据和直接数值同时存在时才计算
    forbidden:
    - 先得到高利润结论再倒推销量和毛利
    - 把名义产能或扩产投资直接变成有效供给
  null_rule: 缺失、unknown、partial、unsupported、no_record均不得转成0；不可计算必须返回null和missing_reasons。
global_formulas:
  component_hardware_revenue:
    formula: min(validated_demand, nominal_capacity * certification_rate * yield_rate * utilization) * average_selling_price
    rule: 任一关键输入缺失则不计算；名义产能不等于有效产能。
  project_revenue:
    formula: min(firm_deliverable_order_amount, completed_and_accepted_amount)
    rule: 框架协议、意向订单和未验收项目不得进入收入。
  incremental_net_profit:
    formula: incremental_gross_profit - incremental_R&D_sales_delivery_expense - incremental_depreciation - incremental_financing_cost
      - bad_debt_and_inventory_impairment - tax
    rule: 不得只用收入乘综合毛利率。
  theme_revenue_share_TRS:
    formula: direct_theme_revenue / company_revenue_same_period
    rule: 同期间、同合并范围、同场景。
  theme_gross_profit_share_TGPS:
    formula: direct_theme_gross_profit / company_gross_profit_same_period
    rule: 主题毛利优先用直接成本；不得用公司综合毛利率代替。
  cash_quality:
    formula: company_CFO / company_parent_net_profit; cash_received_from_sales / company_revenue
    rule: 仅作为公司级质量背景；没有主题现金拆分时不得命名为液冷现金质量。
  working_capital_alerts:
    formula: AR_growth - revenue_growth; inventory_growth - revenue_growth
    rule: 沿用B2原始计算；缺失字段不按0。
  reverse_valuation_own_history:
    positive_PE:
    - PE_260d_p25, PE_260d_p50, PE_260d_p75
    - implied_TTM_parent_profit_at_each_PE = total_market_value / PE_percentile
    - required_profit_change_vs_current_TTM = implied_profit / current_TTM_parent_profit - 1
    PS:
    - PS_260d_p25, PS_260d_p50, PS_260d_p75
    - implied_TTM_revenue_at_each_PS = total_market_value / PS_percentile
    - required_revenue_change_vs_current_TTM = implied_revenue / current_TTM_revenue - 1
    rule: 只是当前市值对应的经营要求，不是目标价；历史窗口仅为实际260个交易日，若数据不足则返回partial/unsupported。
global_C2_tasks:
- task_id: C2T01
  name: 输入和冻结校验
  instructions:
  - 校验研究编号、as_of、9条记录和C1文件哈希。
  - 确认B2公司级财务、估值、价格、收益与派生指标未被改写。
  - 只使用05_B2_本地核查.json中available_at<=as_of的数据。
- task_id: C2T02
  name: 公司级质量快照
  instructions:
  - 对允许的经营主体输出最新可比期和2025年度公司级收入、利润、毛利、CFO、应收、存货、资本开支与预警。
  - 明确标注company_level_not_theme。
  - 中科曙光只输出所有权字段；同飞股份只输出竞争背景，不形成主题情景。
- task_id: C2T03
  name: 直接主题事实
  instructions:
  - 只对ENT036A计算直接披露的冷板液冷与浸没液冷实际收入、成本/毛利、TRS和TGPS。
  - 不年化、不预测、不纳入模块化数据中心和系统集成。
  - 主题净利润和主题现金仍返回null。
- task_id: C2T04
  name: 三情景可计算性
  instructions:
  - 逐实体、逐情景返回calculable / condition_only / not_applicable。
  - 仅保守事实下限中存在锁定数字时计算；基准/乐观缺少直接变量时返回null和missing_reasons。
  - 不得为了完整表格创建任何新假设。
- task_id: C2T05
  name: 260交易日反向经营要求
  instructions:
  - 对B3允许使用估值价格的经营主体，基于本地实际260交易日PE/PS分布计算p25/p50/p75对应的利润或收入要求。
  - PE无效时跳过PE，只使用PS/PB可用事实；不得引入外部估值倍数。
  - 不得对中科曙光建立液冷估值；不得对同飞股份建立主题估值。
- task_id: C2T06
  name: 大市场一致性和供应风险字段
  instructions:
  - 只整理已存在的扩产、新进入者、二供、自制、接口标准化、替代路线和利润池迁移事实/未知。
  - 不估算市场份额总和，除非B2已有同口径可加数据。
