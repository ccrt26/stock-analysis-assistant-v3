objective:
  plain: 把已确认的产业关系和本地事实连接成商业兑现链、证据约束情景、持续性检查和反向经营要求；不为了形成结果而补数。
  C1_may_decide:
  - 每个主体当前商业链走到哪一步
  - 哪些事实允许进入情景，哪些必须保持unknown
  - 保守/基准/乐观情景的条件与触发证据
  - C2允许计算的公式、字段和停止条件
  C1_must_not_decide:
  - 最终研究候选状态
  - 买入、卖出、目标价、仓位、止盈止损或收益承诺
  - 没有来源的销量、份额、毛利、净利润或现金
