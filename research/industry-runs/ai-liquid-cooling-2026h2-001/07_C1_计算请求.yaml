output_contract:
  files:
  - file: 08_C2_计算结果.json
    purpose: 逐实体事实、情景可计算性、确定性计算、反向经营要求和缺口
  - file: 08_C2_计算摘要.md
    purpose: 用户与C3阅读的人话结果，不形成候选或交易动作
  - file: 08_C2_数据缺口.json
    purpose: C1请求中仍无法计算的变量、原因与禁止推断
  - file: 00_运行状态.yaml
    purpose: 运行控制，下一执行者设为ChatGPT C3
  - file: 00_下一步操作.md
    purpose: 给ChatGPT C3的唯一完整提示词
  commit_and_push_required: true
  next_actor_after_completion: chatgpt
  next_step_after_completion: C3_final_synthesis
C2_stop_conditions:
- 9条记录全部返回，记录数守恒。
- 每个情景均有calculability、value/null、source_refs和missing_reasons。
- unknown/partial/unsupported未转成0。
- 只有ENT036A出现直接液冷数量计算。
- 中科曙光没有继承曙光数创主题财务。
- 同飞股份没有进入主题经营或估值情景。
- 未使用外部新材料、未来数据或任意估值倍数。
- 输出五个文件，commit+push后停止，不开始C3或D。
forbidden_inferences:
- 不得修改Codex原始数值
- 缺失、unknown、partial、unsupported和无记录不得写成0
- 公司总收入、综合毛利率和公司现金流不得替代液冷主题值
- 混合业务分项不得强行拆成液冷
- 每个保守/基准/乐观假设必须绑定来源、时间和适用范围
- 没有直接主题数据时只能写条件和待验证变量，不得虚构销量、份额、毛利或现金
- 估值分位只称为实际260交易日窗口
- 相对收益只称为相对沪深300
- 中科曙光只作所有权与归属背景
