not_adopted:
  - description: 海外横截面分化、市场宽度或技术择时论文
    reason: A股已有更直接来源，且海外收益方向未经本地验证；本轮不需要为相同公式增加间接来源。
  - description: 以投资者持股人数定义的ownership breadth研究
    reason: 变量是持有人覆盖，不等于本Skill所说的上涨股票占比，概念不等价。
  - description: 复杂综合流动性因子或PLS流动性指数
    reason: 当前生产事实没有等价变量，增加指标汤会扩大范围；成交条件先用透明原值验证。
  - description: 宏观、情绪和政策代理变量集合
    reason: 当前仓库没有可回放且时点安全的统一宏观事实，本轮不凭叙事补建指标库。
  - description: 仅凭摘要、二手综述或已撤稿研究
    reason: 不满足原始来源和可审计要求，禁止进入Skill与知识结论。
