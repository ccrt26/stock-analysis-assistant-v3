  - knowledge_id: src_cn_factor_momentum_2023
    title: 用A股行业或因子相对表现观察趋势是否延续
    primary_source_id: paper-ma-liao-jiang-factor-momentum-2024
    supporting_source_ids: [paper-cheema-nartea-momentum-state-2017]
