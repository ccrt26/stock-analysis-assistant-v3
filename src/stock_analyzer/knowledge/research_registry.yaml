      - kind: fact
        name: equity_daily
        required_fields: [available_at, trade_date, ts_code, close, high]
      - kind: fact
        name: stock_limit
        required_fields: [available_at, trade_date, ts_code, up_limit]
      - kind: derived
        name: stock_trading_context
        required_fields: [analysis_date, ts_code, latest_limit_up_date, post_limit_behavior_status, return_20d]
    local_validation:
      status: required_before_threshold
      reason: 后续窗口和条件只能通过本地时点历史验证确定，论文不直接提供当前决策阈值。

  - knowledge_id: src_cn_factor_momentum_2023
    title: 用A股行业或因子相对表现观察趋势是否延续
    primary_source_id: paper-ma-liao-jiang-factor-momentum-2024
    source_grade: A
    version_status: current
