    claim_summary: A股日度收益延续与涨跌幅制度有关，触及涨停后应继续检查次日和后续价格表现而不能只看涨停事实。
    allowed_uses:
      - 区分涨停当日、隔夜、次日和后续交易日的价格表现。
      - 将不同板块的涨跌幅规则和可交易性纳入价格结构解释。
    forbidden_uses:
      - 把涨停、连板或封板写成机构行为、筹码稳定或继续上涨保证。
      - 直接继承论文样本中的收益幅度、窗口或交易阈值。
    prerequisites:
      - 核对分析日期、交易板块、涨停价格和实际成交价格。
      - 使用时点可得日线和已复算的涨停后行为观察。
    counter_evidence:
      - 涨停后快速回落、成交受限、停牌或公司出现相反公告。
      - 证券适用不同涨跌幅规则，或样本处于上市初期等特殊交易阶段。
