  - knowledge_id: src_brown_warner_1985
    title: 用事件研究区分公告前后价格变化与市场共同变化
    primary_source_id: paper-brown-warner-1985
    source_grade: A
    version_status: current
    effect: method_only
    modules: [events]
    opportunity_types: [company_event, earnings_rerating]
    topics: [event_price_reaction]
    claim_summary: 公司事件后的价格反应需要与市场共同变化对照，并严格使用分析时点已经公开的事件时间。
    allowed_uses:
      - 以公告时点为边界，对照事件窗口内个股与市场价格变化。
      - 提醒停牌、涨跌停、事件重叠和公告时段可能改变窗口解释。
    forbidden_uses:
      - 在A股本地验证前套用海外事件窗口、显著性标准或收益阈值。
      - 仅凭公告后上涨就认定事件产生因果收益或未来继续上涨。
    prerequisites:
      - 有可追溯公告时点、个股日线、市场日线和交易状态。
      - 公告必须在分析时点已经公开，盘后公告不得当作当日盘中已知信息。
    counter_evidence:
      - 同期市场或行业出现相似变化，个股没有可区分的相对反应。
      - 事件窗口与其他重大公告重叠，或价格因停牌和涨跌停无法正常形成。
    data_requirements:
      - kind: fact
        name: announcement
        required_fields: [announcement_id, announcement_time, available_at, ts_code]
      - kind: fact
        name: equity_daily
        required_fields: [available_at, trade_date, ts_code, close]
      - kind: fact
        name: index_daily
        required_fields: [available_at, trade_date, index_code, close]
    local_validation:
      status: required_before_threshold
      reason: 事件窗口和比较口径必须针对A股交易制度与当前目标期限验证。

  - knowledge_id: src_sun_wen_earnings_car_2023
    title: 用业绩公告窗口相对反应观察后续重估条件
    primary_source_id: paper-sun-wen-earnings-car-2023
    source_grade: A
    version_status: current
    effect: method_only
    modules: [events, fundamentals]
    opportunity_types: [earnings_rerating]
    topics: [event_price_reaction, earnings_drift]
    claim_summary: 中国A股业绩公告窗口的相对价格反应可以作为后续重估研究线索，但需要结合规模、估值和当前基本面重新判断。
    allowed_uses:
      - 比较业绩公告前后个股相对市场表现，并检查后续价格是否继续确认。
      - 将公告内容、估值状态和近期价格反应共同用于判断业绩重估是否仍有空间。
    forbidden_uses:
      - 继承论文历史分组、收益幅度、持有期或机构行为解释作为当前结论。
      - 把公告窗口上涨直接写成未来数周必然延续。
    prerequisites:
      - 有准确公告时点、个股日线、规模估值和交易背景数据。
      - 区分业绩预告、快报和正式财务报告的内容与披露阶段。
    counter_evidence:
      - 公告内容低于此前市场预期、估值已经显著扩张或公告后价格快速转弱。
      - 相对表现主要来自同期市场和行业共同上涨，或公告发生在不可正常交易期间。
    data_requirements:
      - kind: fact
        name: announcement
        required_fields: [announcement_id, announcement_time, available_at, ts_code]
      - kind: fact
        name: equity_daily
        required_fields: [available_at, trade_date, ts_code, open, close]
      - kind: fact
        name: daily_basic
        required_fields: [available_at, trade_date, ts_code, total_mv, pb]
      - kind: derived
        name: stock_trading_context
        required_fields: [analysis_date, ts_code, return_20d, valuation_data_status]
    local_validation:
      status: required_before_threshold
      reason: 论文支持A股方法方向，但当前目标期限、候选范围和决策阈值仍需本地时点验证。

  - knowledge_id: src_chan_2003
    title: 区分正式事件后的价格延续与无事件价格冲击
    primary_source_id: paper-chan-2003
    source_grade: A
    version_status: current
    effect: method_only
    modules: [events]
    opportunity_types: [company_event, earnings_rerating]
    topics: [event_price_reaction]
    claim_summary: 相近的价格变动在有正式事件和没有可识别事件时可能含义不同，分析应先确认时点有效的信息来源。
    allowed_uses:
      - 将正式公告支持的价格变化与没有对应正式事件的价格冲击分开解释。
      - 对事件后延续、无事件反转和信息覆盖不足分别保留条件判断。
    forbidden_uses:
      - 在A股本地验证前套用海外新闻样本、持有期、收益或固定阈值。
      - 把公告库当成完整新闻库，或把未找到公告写成市场上没有任何信息。
    prerequisites:
      - 有时点可追溯的正式公告、个股日线和市场日线。
      - 明确当前数据只覆盖正式公告，不能覆盖所有媒体和投资者信息。
    counter_evidence:
      - 存在尚未纳入本地库但分析时点已公开的重大消息。
      - 价格变化可由市场共同波动、停复牌或涨跌停约束解释。
    data_requirements:
      - kind: fact
        name: announcement
        required_fields: [announcement_id, announcement_time, available_at, ts_code]
      - kind: fact
        name: equity_daily
        required_fields: [available_at, trade_date, ts_code, close]
      - kind: fact
        name: index_daily
        required_fields: [available_at, trade_date, index_code, close]
    local_validation:
      status: required_before_threshold
      reason: 海外研究仅提供信息分类思路，A股事件覆盖和价格窗口必须另行验证。

  - knowledge_id: src_piotroski_2000
    title: 用财务报表变化核对困境公司是否出现经营改善
    primary_source_id: paper-piotroski-2000
    source_grade: A
    version_status: current
    effect: method_only
    modules: [fundamentals]
    opportunity_types: [turnaround]
    topics: [financial_turnaround]
    claim_summary: 困境反转需要从盈利、经营现金流、杠杆、流动性和经营效率等多个财务方向寻找一致改善，而不能只看单项利润增长。
    allowed_uses:
      - 比较相邻报告期盈利、现金流、负债、流动性、毛利率和资产周转的变化方向。
      - 将多项改善作为反转证据，并继续核对业务原因和一次性项目。
    forbidden_uses:
      - 在A股本地验证前复制原论文打分、价值股前置阈值、持有期或历史收益。
      - 因财务指标改善就直接认定经营反转已经完成或股票应当买入。
    prerequisites:
      - 使用分析时点已经披露的损益表、资产负债表、现金流量表和财务指标。
      - 保持报告期可比，并检查会计政策、并购和非经常性项目影响。
    counter_evidence:
      - 利润改善但经营现金流恶化、杠杆上升、流动性下降或周转效率持续走弱。
      - 改善主要来自资产处置、公允价值变动、政府补助或不可持续项目。
    data_requirements:
      - kind: fact
        name: income_statement
        required_fields: [ann_date, available_at, report_period, revenue, n_income_attr_p, ts_code]
      - kind: fact
        name: balance_sheet
        required_fields: [ann_date, available_at, report_period, total_assets, total_cur_assets, total_cur_liab, total_liab, ts_code]
      - kind: fact
        name: cash_flow
        required_fields: [ann_date, available_at, report_period, n_cashflow_act, ts_code]
      - kind: fact
        name: financial_indicator
        required_fields: [available_at, report_period, current_ratio, grossprofit_margin, assets_turn, debt_to_assets, roe, ts_code]
    local_validation:
      status: required_before_threshold
      reason: 财务方向可执行，但评分、阈值和预测权重必须按A股本地样本验证。
