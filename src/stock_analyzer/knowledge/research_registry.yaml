      - 分部事实与公司总收入和营业利润能够衔接；无效分母必须明确标记。
    counter_evidence:
      - 相关业务只停留在规划、研发、概念名称或互动回复，尚无正式产品、项目或经营金额。
      - 分部收入利润占比较小、持续下降、币种不可比或分部披露口径发生变化。
