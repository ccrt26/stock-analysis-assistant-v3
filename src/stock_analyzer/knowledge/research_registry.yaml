    effect: analysis_evidence
    modules: [company_business, fundamentals]
    opportunity_types: [general, industry_trend, company_event]
    topics: [business_transmission]
    claim_summary: 公司与热点存在真实联系后，还要分别核对相关产品或业务分部对收入、成本和利润的实际贡献，概念或小额业务不能自动代表公司整体受益。
    allowed_uses:
      - 在同报告期和同分类口径内复算分部收入占公司收入、分部利润占营业利润及分部毛利率。
      - 结合公司资料和正式公告解释该业务对公司今天的实际意义。
    forbidden_uses:
      - 把会计准则的报告分部门槛改成选股阈值、评分或上涨概率。
