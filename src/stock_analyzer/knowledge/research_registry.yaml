    claim_summary: A股行业或因子层面的相对表现可能具有阶段性延续，热点判断应观察一组股票的共同表现而不是只看单一个股。
    allowed_uses:
      - 比较行业相对收益、上涨面和成员共同表现是否相互支持。
      - 区分板块共同趋势、单一龙头带动和已经拥挤的价格表现。
    forbidden_uses:
      - 直接把历史因子组合收益、形成期或阈值写入正式选择规则。
      - 仅凭板块名称、单只强势股或第三方热度标签认定持续热点。
