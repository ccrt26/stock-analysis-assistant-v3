  - knowledge_id: src_liu_stambaugh_yuan_2019
    title: 用A股本地规模和估值信息比较候选而非照搬海外因子
    primary_source_id: paper-liu-stambaugh-yuan-2019
    source_grade: A
    version_status: current
    effect: method_only
    modules: [fundamentals, valuation]
    opportunity_types: [general, turnaround]
    topics: [valuation_method]
    claim_summary: A股的规模、壳价值和估值关系具有本地特征，规模与价值比较应剔除明显失真的极小市值样本并结合盈利质量。
    allowed_uses:
      - 比较候选公司的市值、盈利估值、账面估值和盈利质量是否相互支持。
      - 提醒低估值可能来自壳价值、持续亏损或退市风险，需要先检查基本面与证券状态。
    forbidden_uses:
      - 直接继承论文历史分组、历史收益或固定阈值作为买入条件。
      - 把低估值、小市值或因子归属写成未来上涨保证。
    prerequisites:
      - 使用分析时点已可得的市值、估值、财务指标和证券状态。
      - 在同市场、同机会类型和可比业务之间比较候选。
    counter_evidence:
      - 估值数据缺失或因亏损、净资产异常而失去可比性。
      - 低估值同时伴随盈利恶化、现金流压力、退市风险或持续稀释。
    data_requirements:
