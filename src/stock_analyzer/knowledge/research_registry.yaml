      - 使用按分析时点有效的行业成分和行业日线。
      - 与可复算板块热度证据共同使用，并保留拥挤和失效观察。
    counter_evidence:
      - 相对收益由少数成员贡献、上涨面收窄或成交拥挤显著上升。
