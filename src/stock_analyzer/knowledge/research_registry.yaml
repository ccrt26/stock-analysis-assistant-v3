      - kind: fact
        name: financial_indicator
        required_fields: [available_at, report_period, ts_code, roe, grossprofit_margin, debt_to_assets]
      - kind: derived
        name: stock_trading_context
        required_fields: [analysis_date, ts_code, pe_ttm, pb, valuation_data_status]
    local_validation:
      status: required_before_threshold
      reason: 方法可用于组织比较，但任何分组、阈值和预测权重都必须在A股本地时点样本中验证。

  - knowledge_id: src_cn_t1_contrarian_2024
    title: 区分A股短期反转与中期趋势延续
    primary_source_id: paper-zhang-zhu-t1-2024
    source_grade: A
    version_status: current
    effect: method_only
    modules: [market_environment, price_trading]
    opportunity_types: [general]
    topics: [market_price_persistence]
    claim_summary: A股短期价格路径可能受交易制度影响而出现反转，近期上涨不能自动外推为未来数周继续上涨。
    allowed_uses:
      - 对照个股与市场近期收益，判断当前更像极短期反转、趋势延续还是尚无清晰状态。
      - 把交易制度、可交易性和市场环境列为解释价格路径的必要条件。
    forbidden_uses:
      - 直接套用论文形成期、持有期、历史收益或固定反转阈值。
      - 因短期下跌就判定必然反弹，或因短期上涨就判定趋势必然延续。
    prerequisites:
      - 使用时点有效的个股和市场日线，并核对停牌、涨跌停和上市状态。
      - 将价格观察与公司、行业和事件证据分开记录。
    counter_evidence:
      - 公司出现新的基本面恶化、正式风险公告或流动性约束。
      - 价格变化由除权、复牌或不可交易状态主导，无法与普通样本比较。
    data_requirements:
      - kind: fact
        name: equity_daily
        required_fields: [available_at, trade_date, ts_code, close]
      - kind: fact
        name: index_daily
        required_fields: [available_at, trade_date, index_code, close]
      - kind: derived
        name: stock_trading_context
        required_fields: [analysis_date, ts_code, return_20d, countertrend_status]
    local_validation:
      status: required_before_threshold
      reason: 反转区间和强度随市场制度与样本变化，必须按当前A股目标期限重新验证。

  - knowledge_id: src_cn_price_limit_momentum_2025
    title: 涨停是制度约束下的价格结果而非后续上涨保证
    primary_source_id: paper-zhang-zhang-price-limit-2025
    source_grade: A
    version_status: current
    effect: method_only
    modules: [market_environment, price_trading]
