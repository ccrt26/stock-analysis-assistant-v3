  - knowledge_id: src_cn_relative_valuation_context
    title: 在同行、自身历史和盈利背景中解释估值兑现要求
    primary_source_id: paper-jansen-swinkels-zhou-2021
    supporting_source_ids: [paper-li-liu-liu-wei-2024]
    source_grade: A
    version_status: current
    effect: analysis_evidence
    modules: [valuation, fundamentals, target_conditions]
    opportunity_types: [general, industry_trend, earnings_rerating, cycle_inflection, company_event, turnaround]
    topics: [valuation_method, profitability_quality]
    claim_summary: PE、PB和PS只有在同日、同行业、同盈利状态和公司自身历史可比时才说明预期兑现要求，估值位置本身不能预测未来收益。
    allowed_uses:
      - 分别展示同行估值位置、公司自身历史位置、盈利成长现金质量和市值背景。
      - 解释候选当前价格要求公司兑现哪些经营条件，以及为什么估值不可比。
    forbidden_uses:
      - 因低估值、小市值或某个因子分位就加分、买入或承诺未来收益。
      - 把多个估值与质量观察机械相加，或复制论文历史组合、收益和固定阈值。
    prerequisites:
      - 只使用分析时点已公开数据，并优先在同日、同行业和同盈利状态中比较。
      - 极端值采用稳健百分位处理，检查行业、规模、微盘污染和交易可行性。
    counter_evidence:
      - 亏损、负净资产、非正估值、可比组过窄或会计口径变化使估值失去可比性。
      - 盈利、成长或现金质量恶化，说明表面低估值可能对应更高经营风险。
    data_requirements:
      - {kind: fact, name: daily_basic, required_fields: [trade_date, ts_code, pe_ttm, pb, ps_ttm, total_mv, available_at]}
      - {kind: fact, name: industry_member, required_fields: [ts_code, industry_code, valid_from, valid_to, available_at]}
      - {kind: fact, name: income_statement, required_fields: [ts_code, report_period, n_income_attr_p, available_at]}
      - {kind: fact, name: cash_flow, required_fields: [ts_code, report_period, n_cashflow_act, available_at]}
      - {kind: fact, name: financial_indicator, required_fields: [ts_code, report_period, roe, or_yoy, available_at]}
    local_validation:
      status: validated
      reason: 当前仓库能执行时点正确的同行、自身历史、盈利状态和规模背景比较，并明确无效估值而不生成因子分数。
      validation_reference: targeted_gap_validation_results.yaml#src_cn_relative_valuation_context

  - knowledge_id: src_cn_turnaround_financial_consistency
    title: 用多张财务报表的方向一致性核对困境改善
    primary_source_id: paper-zhao-xu-ji-2023
    supporting_source_ids: [paper-dechow-ge-schrand-2010]
    source_grade: A
    version_status: current
    effect: analysis_evidence
    modules: [fundamentals, risk]
    opportunity_types: [turnaround]
    topics: [financial_turnaround, profitability_quality]
    claim_summary: 困境改善不能只看利润转正，经营结果、现金、流动性、短债、应收存货、减值和非经营项目必须分别核对并保留相反方向。
    allowed_uses:
      - 按同季可比口径分别观察营业利润、经营现金、流动比率、短债压力、应收存货和减值非经营项目变化。
      - 将多表不一致表达为局部改善或反证，并继续核对业务原因和正式风险公告。
    forbidden_uses:
      - 复制机器学习模型、变量权重、AUC、ST概率、Piotroski分数或固定淘汰门槛。
      - 因多项财务改善就直接预测股价上涨、反转完成或买入行动。
    prerequisites:
      - 只使用分析时点已公开、报告期和报表口径可比的损益表、资产负债表、现金流量表和财务指标。
      - 各维度分别保留，缺失或零变化不能写成已经确认改善。
    counter_evidence:
      - 利润改善但经营现金、流动性、短债或应收存货压力继续恶化。
      - 改善主要依赖资产处置、非经营收入、减值转回或其他不可持续项目。
    data_requirements:
      - {kind: fact, name: income_statement, required_fields: [ts_code, report_period, revenue, operate_profit, n_income_attr_p, assets_impair_loss, non_oper_income, available_at]}
      - {kind: fact, name: balance_sheet, required_fields: [ts_code, report_period, total_assets, total_cur_assets, total_cur_liab, total_liab, money_cap, st_borr, non_cur_liab_due_1y, accounts_receiv, inventories, available_at]}
      - {kind: fact, name: cash_flow, required_fields: [ts_code, report_period, n_cashflow_act, available_at]}
      - {kind: fact, name: financial_indicator, required_fields: [ts_code, report_period, current_ratio, debt_to_assets, available_at]}
    local_validation:
      status: validated
      reason: 当前仓库能逐项复算多表方向，历史上大量利润改善同时存在其他维度反证，说明该核对可直接使用但不能形成困境概率。
      validation_reference: targeted_gap_validation_results.yaml#src_cn_turnaround_financial_consistency

  - knowledge_id: src_cn_short_term_engine_separation
    title: 分开记录公司催化、基本面锚、传播与价格确认
    primary_source_id: paper-brown-warner-1985
    supporting_source_ids: [paper-mackinlay-event-study-1997, paper-sun-wen-earnings-car-2023]
    source_grade: A
    version_status: current
    effect: method_only
    modules: [events, sector_theme, fundamentals, price_trading]
    opportunity_types: [general, industry_trend, earnings_rerating, company_event, turnaround]
    topics: [event_price_reaction, business_transmission, short_term_engine]
    claim_summary: 公司事件和基本面事实先说明催化或经营锚；候选应结构化区分发动机类型、状态和市场识别。通常只有新信息或新需求形成板块传播或股票需求，并得到可用市场或行业基准下的真实价格成交数值确认时，才是已确认短期发动机；形成日收盘后重大首次披露或实质增量事件可在尚无完整反应交易日时保留为条件性待确认发动机。该链仍不保证未来收益。
    allowed_uses:
      - 将公司催化、基本面锚、板块传播、股票需求、价格确认、剩余路径和公司风险分开解释。
      - 结构化记录发动机类型、确认或待确认状态、市场识别、披露新颖性和适用的板块龙头簇，以便D20后分层复盘。
      - 对形成日已可见的具体事件计算事件前5日及事件后1、3、5个完整交易日的绝对、相对市场、相对行业、成交额和收盘质量反应。
      - 将形成日收盘后重大首次披露或实质增量事件记录为fresh_event_pending及行动条件，但明确尚未形成价格确认。
      - 用最接近同类检查传播和价格确认是否为候选自身增量。
    forbidden_uses:
      - 因业绩增长、低估值、现金流良好、低位或材料完整就宣称短期上涨发动机成立。
      - 把事件后绝对上涨、未透支、行动日条件或任一场景名称单独写成正向价格确认。
      - 把重复披露、普通财报、有限增量、低估值、现金流、低位或无新增信息放入fresh_event_pending通道。
      - 把观察链改成总分、权重、固定阈值、Gate或收益承诺。
    prerequisites:
      - 冻结formation_date、action_date和带时区as_of，只使用available_at不晚于as_of的事件与事实。
      - 由AI先选定经济上相关的具体事件；程序只做交易日对齐和确定性计算。
      - 使用按as_of官方收盘边界截断的复权OHLC、成交额、宽基指数和形成日有效的申万二级成员；停牌、缺失和窗口不足必须披露。
      - 用截至as_of的同类历史披露区分首次、增量、重复或历史不足；材料性和语义仍由AI判断。
    counter_evidence:
      - 相对市场和行业没有可区分反应，成交增加但价格不推进，或反应主要发生在事件公开前。
      - 板块只有标签或少数龙头，候选没有自身需求增量，或更接近同类拥有更强确认。
      - 事件刚公开尚无首个完整反应交易日，存在事件重叠，或基本面和公司风险与催化冲突。
      - 所谓新事件其实重复了预告、快报或先前公告，或新增信息不足以形成新的股票需求。
    data_requirements:
      - {kind: fact, name: announcement, required_fields: [announcement_id, announcement_time, ts_code, available_at]}
      - {kind: fact, name: equity_daily, required_fields: [trade_date, ts_code, open, high, low, close, amount, available_at]}
      - {kind: fact, name: adj_factor, required_fields: [trade_date, ts_code, adj_factor, available_at]}
      - {kind: fact, name: index_daily, required_fields: [trade_date, index_code, close, available_at]}
      - {kind: fact, name: industry_member, required_fields: [ts_code, industry_code, valid_from, valid_to, available_at]}
      - {kind: derived, name: price_analysis_context, required_fields: [analysis_date, ts_code, relative_return_5d, relative_industry_return_5d, amount_ratio_last_20d]}
    local_validation:
      status: insufficient_for_direction
      reason: 现有本地验证和A股文献支持事件时点、共同变化扣除及分离解释的方法，但不支持把该链或任何固定反应阈值当成未来20日收益方向规则。

