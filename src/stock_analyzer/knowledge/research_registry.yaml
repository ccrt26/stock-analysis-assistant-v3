    claim_summary: A股行业或因子层面的相对表现可能具有阶段性延续，热点判断应观察一组股票的共同表现而不是只看单一个股。
    allowed_uses:
      - 比较一日、五日和二十日相对收益、上涨面、中位数收益、成交占比变化、新高和涨停是否相互支持。
      - 用前三强贡献和参与宽度区分板块共同趋势、少数龙头带动和已经拥挤的价格表现。
      - 因子观察优先在同分析日期、同行业和同盈利状态中比较，并保留交易可行性。
    forbidden_uses:
      - 直接把论文历史因子组合收益、形成期、阈值或权重写入正式选择规则。
      - 仅凭板块名称、单只强势股或第三方热度标签认定持续热点。
      - 把多个因子观察机械相加成总分，或把板块热度证据写成最终热点排名。
    prerequisites:
      - 只使用分析时点已经公开、按当日有效的行业成分、行业日线和sector-hotspot-v3观察。
      - 极端值采用排序、分位或缩尾等稳健处理，并检查行业、规模和微盘股污染。
      - 与可复算板块热度证据共同使用；这些证据不是最终热点排名。
    counter_evidence:
      - 反证包括相对收益由少数成员贡献、上涨面收窄、高成交低进展、量价背离、冲高回落或成交拥挤显著上升。
      - 行业成分映射失效，或个股业务与板块主题缺乏正式披露联系。
      - 交易可行性不足、极小市值污染或稳健处理后观察消失。
    data_requirements:
      - kind: fact
        name: industry_daily
        required_fields: [available_at, trade_date, industry_code, close]
      - kind: fact
        name: industry_member
        required_fields: [available_at, industry_code, ts_code, valid_from, valid_to]
      - kind: derived
        name: sector_hotspot
        required_fields:
          - analysis_date
          - equity_return_price_basis
          - group_code
          - group_type
          - relative_return_1d
          - relative_return_5d
          - relative_return_20d
          - breadth_1d
          - breadth_20d
          - median_return_20d
          - turnover_share_average_20d
          - turnover_share_change_5d
          - top3_positive_contribution_1d
          - new_high_20d_share
          - limit_up_share
          - high_volume_low_progress_flag
          - narrow_participation_flag
          - turnover_return_divergence_flag
          - upper_wick_reversal_flag
    local_validation:
      status: validated
      reason: 本地验证确认不同市场状态下趋势延续关系明显不同，连续上涨也不能自动支持追强。
      validation_reference: supplement_validation_results.yaml#src_cn_factor_momentum_2023
