  - knowledge_id: src_piotroski_2000
    title: 用财务报表变化核对困境公司是否出现经营改善
    primary_source_id: paper-piotroski-2000
    source_grade: A
    version_status: historical_only
    effect: method_only
    modules: [fundamentals]
    opportunity_types: [turnaround]
    topics: [financial_turnaround]
    claim_summary: 困境反转需要从盈利、经营现金流、杠杆、流动性和经营效率等多个财务方向寻找一致改善，而不能只看单项利润增长。
    allowed_uses:
      - 比较相邻报告期盈利、现金流、负债、流动性、毛利率和资产周转的变化方向。
      - 将多项改善作为反转证据，并继续核对业务原因和一次性项目。
    forbidden_uses:
      - 在A股本地验证前复制原论文打分、价值股前置阈值、持有期或历史收益。
      - 因财务指标改善就直接认定经营反转已经完成或股票应当买入。
    prerequisites:
      - 使用分析时点已经披露的损益表、资产负债表、现金流量表和财务指标。
      - 保持报告期可比，并检查会计政策、并购和非经常性项目影响。
    counter_evidence:
      - 利润改善但经营现金流恶化、杠杆上升、流动性下降或周转效率持续走弱。
      - 改善主要来自资产处置、公允价值变动、政府补助或不可持续项目。
    data_requirements:
      - kind: fact
        name: income_statement
        required_fields: [ann_date, available_at, report_period, revenue, n_income_attr_p, ts_code]
      - kind: fact
        name: balance_sheet
        required_fields: [ann_date, available_at, report_period, total_assets, total_cur_assets, total_cur_liab, total_liab, ts_code]
      - kind: fact
        name: cash_flow
        required_fields: [ann_date, available_at, report_period, n_cashflow_act, ts_code]
      - kind: fact
        name: financial_indicator
        required_fields: [available_at, report_period, current_ratio, grossprofit_margin, assets_turn, debt_to_assets, roe, ts_code]
    local_validation:
      status: required_before_threshold
      reason: 财务方向可执行，但评分、阈值和预测权重必须按A股本地样本验证。

  - knowledge_id: src_cn_return_dispersion_risk
    title: 用市场与行业收益分化识别内部脆弱性
    primary_source_id: paper-fei-liu-wen-dispersion-2019
    source_grade: A
    version_status: current
    effect: analysis_evidence
    maturity: level_2_direct
    modules: [market_environment, sector_theme, risk]
    opportunity_types: [general, industry_trend]
    topics: [return_dispersion]
    claim_summary: 收益分化扩大可作为共同上涨程度下降和后续波动上升的风险证据，但不决定涨跌方向。
    allowed_uses:
      - 比较市场或行业成员日收益分化及其相对过去20日基线的变化。
      - 市场分化相对基线偏高时，提高未来约20日波动和路径不确定性的风险权重，并要求价格视角检查候选失效点。
    forbidden_uses:
      - 仅凭分化扩大断言市场即将上涨或下跌。
      - 从分化推断羊群、机构、主力或账户身份，或把历史相关系数变成市场分数。
    prerequisites:
      - 使用默认股票范围、分析时点有效的行业成员和复权日收益。
      - 当前复权与股票覆盖可靠，且当日分化与过去20日均值使用同一口径。
    counter_evidence:
      - 分化上升但后续波动未扩大，或新的前向样本使关系转负或稳定性消失。
      - 分化主要由错误复权、覆盖变化或少数异常股票造成。
    data_requirements:
      - {kind: fact, name: equity_daily, required_fields: [trade_date, ts_code, close, available_at]}
      - {kind: fact, name: industry_member, required_fields: [ts_code, industry_code, valid_from, valid_to, available_at]}
      - {kind: derived, name: market_context, required_fields: [return_dispersion_1d, return_dispersion_20d_average, return_dispersion_ratio_20d]}
    local_validation:
      status: validated
      reason: 行业级既有关系稳定；新的75个验证形成日中，市场分化与后续20日等权实现波动秩相关0.4772，95%区间为0.1707至0.6833，Holm校正后p为0.0160，2025与2026均为正。
      validation_reference: supplement_validation_results.yaml#src_cn_return_dispersion_risk
      market_validation_reference: market_skill_validation_results.yaml#market_h3_dispersion_future_volatility

