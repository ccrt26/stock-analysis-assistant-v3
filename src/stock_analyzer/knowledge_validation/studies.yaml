schema_version: v1
studies:
  - study_id: a_share_size_value
    specification_version: v1
    knowledge_ids: [src_liu_stambaugh_yuan_2019]
    migration_ids: [src_fama_french_1992, src_liu_stambaugh_yuan_2019]
    theory_claim: A股估值比较需要控制规模，并排除盈利不可比的公司。
    signal_definition: 在每个交易日先按流通市值分为三组，再在各组正市盈率公司中按盈利收益率分为五组，最小市值的百分之三十另行观察。
    primary_hypothesis: 同一市值组内高盈利收益率组未来二十个交易日的市场超额收盘收益高于低盈利收益率组。
    primary_statistic: ep_top_minus_bottom_20d_market_excess_return
    horizons: [10, 20, 30]
    required_datasets: [trade_calendar, security_master, equity_daily, adj_factor, daily_basic, index_daily, suspension]
    sufficiency:
      minimum_overall_units: 720
      minimum_confirmation_units: 180
      minimum_time_blocks: 24
      minimum_companies: 0
      minimum_confirmation_companies: 0
      minimum_calendar_quarters: 0
      minimum_year_over_year_comparisons: 0
    robustness_checks: [development_confirmation_split, date_level_aggregation, cap_tercile_comparison, smallest_thirty_percent_separate]

  - study_id: a_share_momentum_reversal
    specification_version: v1
    knowledge_ids: [src_cn_t1_contrarian_2024]
    migration_ids: [src_jegadeesh_titman_1993]
    theory_claim: A股个股短期价格延续与反转不能照搬海外结论，需要在当前交易制度下本地检验。
    signal_definition: 每个交易日按过去二十个交易日复权收益排序，并以股票代码作为并列时的固定次序，形成五组。
    primary_hypothesis: 过去二十日收益最低组未来五日的市场超额收盘收益高于最高组，十日、二十日和三十日只作为后续观察。
    primary_statistic: prior_20d_bottom_minus_top_5d_market_excess_return
    horizons: [10, 20, 30]
    required_datasets: [trade_calendar, security_master, equity_daily, adj_factor, index_daily, suspension]
    sufficiency:
      minimum_overall_units: 720
      minimum_confirmation_units: 180
      minimum_time_blocks: 24
      minimum_companies: 0
      minimum_confirmation_companies: 0
      minimum_calendar_quarters: 0
      minimum_year_over_year_comparisons: 0
    robustness_checks: [development_confirmation_split, date_level_aggregation, ten_twenty_thirty_session_follow_up, suspension_exclusion]

  - study_id: price_limit_t_plus_one
    specification_version: v1
    knowledge_ids: [src_cn_price_limit_momentum_2025]
    migration_ids: []
    theory_claim: 触及涨停价和收盘封住涨停是不同交易结果，其次日表现需要与同日可比股票比较。
    signal_definition: 以当日最高价达到涨停价识别触及，以收盘价达到涨停价识别收盘封住，并匹配同日市值三组和过去二十日收益五组的未触及股票。
    primary_hypothesis: 触及涨停股票的下一交易日收盘收益与同日匹配未触及股票存在可重复差异。
    primary_statistic: next_session_return_minus_same_date_matched_non_touch
    horizons: [10, 20, 30]
    required_datasets: [trade_calendar, security_master, equity_daily, adj_factor, stock_limit, daily_basic, index_daily, suspension]
    sufficiency:
      minimum_overall_units: 720
      minimum_confirmation_units: 180
      minimum_time_blocks: 24
      minimum_companies: 0
      minimum_confirmation_companies: 0
      minimum_calendar_quarters: 0
      minimum_year_over_year_comparisons: 0
    robustness_checks: [development_confirmation_split, touched_and_closed_separate, same_date_matching, next_session_available]

  - study_id: a_share_factor_industry_momentum
    specification_version: v1
    knowledge_ids: [src_cn_factor_momentum_2023]
    migration_ids: []
    theory_claim: A股行业价格延续需要同时观察相对收益、上涨面和强势集中程度，不能只凭行业名称或单只股票上涨判断。
    signal_definition: 按行业过去二十个交易日相对市场收益分为五组，并分别记录成员上涨面和强势收益集中程度作为条件。
    primary_hypothesis: 过去二十日相对收益最高行业组未来二十日的行业相对收益高于最低组。
    primary_statistic: industry_relative_top_minus_bottom_20d_return
    horizons: [10, 20, 30]
    required_datasets: [trade_calendar, security_master, industry_member, industry_daily, equity_daily, adj_factor, index_daily, suspension]
    sufficiency:
      minimum_overall_units: 480
      minimum_confirmation_units: 120
      minimum_time_blocks: 16
      minimum_companies: 0
      minimum_confirmation_companies: 0
      minimum_calendar_quarters: 0
      minimum_year_over_year_comparisons: 0
    robustness_checks: [development_confirmation_split, date_level_aggregation, breadth_condition, concentration_condition]

  - study_id: overseas_industry_momentum_method
    specification_version: v1
    knowledge_ids: [src_moskowitz_grinblatt_1999]
    migration_ids: []
    theory_claim: 海外行业动量研究只能提供分解方法，是否适用于当前A股必须比较扣除行业收益前后的个股差异。
    signal_definition: 同时计算个股与所属行业过去二十个交易日收益，再比较个股组合差异在扣除行业收益后缩小了多少。
    primary_hypothesis: 扣除所属行业收益后，按个股过去二十日收益形成的组间差异显著缩小。
    primary_statistic: individual_spread_reduction_after_industry_subtraction
    horizons: [10, 20, 30]
    required_datasets: [trade_calendar, security_master, industry_member, industry_daily, equity_daily, adj_factor, index_daily, suspension]
    sufficiency:
      minimum_overall_units: 480
      minimum_confirmation_units: 120
      minimum_time_blocks: 16
      minimum_companies: 0
      minimum_confirmation_companies: 0
      minimum_calendar_quarters: 0
      minimum_year_over_year_comparisons: 0
    robustness_checks: [development_confirmation_split, date_level_aggregation, industry_subtraction, industry_membership_as_of]

  - study_id: daily_event_study
    specification_version: v1
    knowledge_ids: [src_brown_warner_1985]
    migration_ids: [src_fama_fisher_jensen_roll_1969, src_brown_warner_1985, src_mackinlay_1997]
    theory_claim: 日收益事件研究方法在A股正式公告数据上的误差与覆盖范围必须先校准，不能把不显著误当成没有影响。
    signal_definition: 按正式公告时间映射交易日，计算事件日到下一交易日的市场调整累计异常收益，并用同公司非事件日期构造伪事件。
    primary_hypothesis: 伪事件平均累计异常收益在正负百分之零点二五的等价区间内，且经验百分之九十五区间覆盖率位于百分之九十二至百分之九十八。
    primary_statistic: pseudo_event_tost_and_empirical_interval_coverage
    horizons: [10, 20, 30]
    required_datasets: [trade_calendar, security_master, announcement, equity_daily, adj_factor, index_daily, suspension]
    sufficiency:
      minimum_overall_units: 120
      minimum_confirmation_units: 40
      minimum_time_blocks: 0
      minimum_companies: 60
      minimum_confirmation_companies: 0
      minimum_calendar_quarters: 4
      minimum_year_over_year_comparisons: 0
    robustness_checks: [development_confirmation_split, company_event_aggregation, pseudo_event_equivalence, empirical_interval_coverage]

  - study_id: a_share_earnings_announcement_drift
    specification_version: v1
    knowledge_ids: [src_sun_wen_earnings_car_2023]
    migration_ids: [src_ball_brown_1968, src_bernard_thomas_1989]
    theory_claim: A股业绩信息发布后的价格延续应以正式披露时点和本地样本检验，不能继承海外盈余意外口径。
    signal_definition: 将业绩预告、业绩快报和定期报告公告映射到可交易事件日，按事件日到下一交易日的市场调整累计异常收益分为五组。
    primary_hypothesis: 事件累计异常收益最高组随后二十个交易日的市场超额收盘收益高于最低组。
    primary_statistic: event_car_top_minus_bottom_20d_post_event_excess_return
    horizons: [10, 20, 30]
    required_datasets: [trade_calendar, security_master, earnings_forecast, earnings_express, announcement, equity_daily, adj_factor, daily_basic, index_daily, suspension]
    sufficiency:
      minimum_overall_units: 80
      minimum_confirmation_units: 30
      minimum_time_blocks: 0
      minimum_companies: 40
      minimum_confirmation_companies: 0
      minimum_calendar_quarters: 4
      minimum_year_over_year_comparisons: 0
    robustness_checks: [development_confirmation_split, company_event_aggregation, disclosure_type_separate, after_close_next_session]

  - study_id: formal_announcement_price_reaction
    specification_version: v1
    knowledge_ids: [src_chan_2003]
    migration_ids: [src_chan_2003]
    theory_claim: 极端价格波动是否伴随本地正式公告，能够帮助区分已知信息冲击与未在本地公告库匹配到的冲击，但不能声称不存在其他公开信息。
    signal_definition: 以同日绝对市场调整收益最高百分之五识别极端交易日，再按同日、市值三组和极端波动幅度五组匹配，并记录是否匹配到本地正式公告。
    primary_hypothesis: 匹配到正式公告的极端波动与本地未匹配冲击在随后二十个交易日的市场超额收盘收益存在可重复差异。
    primary_statistic: announced_minus_locally_unmatched_shock_20d_return
    horizons: [10, 20, 30]
    required_datasets: [trade_calendar, security_master, announcement, equity_daily, adj_factor, daily_basic, index_daily, suspension]
    sufficiency:
      minimum_overall_units: 120
      minimum_confirmation_units: 40
      minimum_time_blocks: 0
      minimum_companies: 60
      minimum_confirmation_companies: 0
      minimum_calendar_quarters: 4
      minimum_year_over_year_comparisons: 0
    robustness_checks: [development_confirmation_split, company_event_aggregation, same_date_size_move_matching, local_announcement_wording_boundary]

  - study_id: financial_quality_turnaround
    specification_version: v1
    knowledge_ids: [src_piotroski_2000]
    migration_ids: [src_dechow_ge_schrand_2010, src_sloan_1996, src_piotroski_2000, src_novy_marx_2013]
    theory_claim: 财务改善应拆成当前报表能够复算的方向，并检验改善方向数量与未来收益的关系，不能照搬原论文固定总分。
    signal_definition: 逐报告期记录净资产收益率上升、经营现金流上升、杠杆下降、流动比率上升、利润率上升和资产周转率上升六个方向的成立数量。
    primary_hypothesis: 六个财务改善方向成立数量与随后二十个交易日的市场超额收盘收益在报告期层面呈正向秩相关。
    primary_statistic: report_period_spearman_improvement_count_vs_20d_excess_return
    horizons: [10, 20, 30]
    required_datasets: [trade_calendar, security_master, income_statement, balance_sheet, cash_flow, financial_indicator, equity_daily, adj_factor, index_daily, suspension]
    sufficiency:
      minimum_overall_units: 8
      minimum_confirmation_units: 2
      minimum_time_blocks: 0
      minimum_companies: 200
      minimum_confirmation_companies: 60
      minimum_calendar_quarters: 0
      minimum_year_over_year_comparisons: 2
    robustness_checks: [development_confirmation_split, company_report_period_aggregation, two_year_over_year_comparisons, six_directions_separate]
